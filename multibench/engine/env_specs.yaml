  - numba>=0.48
  - scipy
  - loompy
  - tqdm
  - matplotlib
  - hyperopt==0.1.2
  - xlrd==1.2.0
  pip_git:
  - git+https://github.com/bm2-lab/scMVP.git
  package_source: Vendored in tools_scripts/scMVP/scMVP/ (setup.py, package scMVP 0.0.1); upstream GitHub bm2-lab/scMVP, not on PyPI. Install the vendored copy with `pip install -e`, or use the git URL.
  difficulty: verified
  verified_working: true
  caveats: 'numpy<2: main_scMVP.py uses np.mat, removed in numpy 2.0. scikit-learn==0.22.2, hyperopt==0.1.2 and xlrd==1.2.0 are pinned by scMVP''s setup.py, which targets Python 3.7. main_scMVP.py hardcodes use_cuda = True.'
scMM:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch
  - torchvision
  - torchnet
  - pyro-ppl
  - pandas
  - scipy
  - scikit-learn
  - umap-learn
  - h5py
  - matplotlib
  - seaborn
  pip_git: []
  package_source: 'No installable package: the code (main_scMM.py, models/, datasets.py, objectives.py, utils.py, vis.py) is vendored in tools_scripts/scMM/; upstream kodaim1115/scMM.'
  difficulty: easy
  verified_working: false
  caveats: 'numpy<2: main_scMM.py uses np.mat, removed in numpy 2.0. The models import torchnet (torchnet.dataset), pyro-ppl (ZeroInflatedNegativeBinomial), torchvision and the local vis.py, which imports matplotlib, seaborn and umap-learn, so all of these are required. No torch version is pinned. Runs on the GPU when one is available, otherwise on CPU (--no_cuda forces CPU).'
scMDC:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
