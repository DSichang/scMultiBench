    torch==1.11.0 from PyPI is a CPU/CUDA-bundled build; for a specific CUDA (cu102/cu113) use the PyTorch wheel index. If exact old pins conflict on the target platform, a workable looser combo is numpy<2 + scipy<1.8 + scanpy==1.9.* + anndata==0.8.* + a CUDA-enabled torch."'
