scJoint:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch
  - h5py
  - pandas
  - scipy
  - scikit-learn
  pip_git: []
  package_source: 'No installable package: the code is vendored in tools_scripts/scJoint/ (adapted from SydneyBioX/scJoint); not on PyPI.'
  difficulty: easy
  verified_working: false
  caveats: 'Python 3.9 at most: main_scJoint.py imports the stdlib parser module, removed in Python 3.10. util/dataloader_stage1.py uses np.float, removed in numpy 1.24, so numpy must resolve below 1.24; the numpy<2 pin alone does not guarantee that. --use_cuda defaults to True and is declared with type=bool, so only an empty value (--use_cuda '''') turns CUDA off. util/libutility.so is an x86-64 ELF used only by the stage-3 data loader, which main_scJoint.py leaves commented out. process_db.py writes .npz and .txt conversions next to the input .h5 and label .csv files, so their directory must be writable.'
GLUE:
