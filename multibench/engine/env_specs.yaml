# Per-method environment recipes, written by hand. multibench.engine.registry.load()
# attaches each entry to its method as env_spec; read one with mtb.env.recipe(method).
SCALEX:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scalex
  - scanpy
  - h5py
  - anndata
  - numpy<2
  pip_git: []
  package_source: 'PyPI: scalex (upstream jsxlei/SCALEX); installs torch as a dependency.'
  difficulty: verified
  verified_working: true
  caveats: numpy<2 is a precaution for the scanpy/torch stack; main_SCALEX.py uses no API removed in numpy 2.0.
Multigrate:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools<0.20
  - multigrate==0.0.2
  - muon
  - numpy<2
  - scanpy
  - anndata
  - pandas
  - h5py
  - scipy
  pip_git: []
  package_source: 'PyPI: multigrate==0.0.2 (imported as multigrate).'
  difficulty: old-scvi
  verified_working: true
  caveats: 'scvi-tools<0.20: multigrate 0.0.2 imports scvi._compat, which scvi-tools 0.20 removed. numpy<2: the mosaic scripts use np.mat, removed in numpy 2.0. multigrate 0.0.2 requires Python >=3.9,<3.11. muon provides the ADT CLR normalization (muon.prot.pp.clr); torch is installed through scvi-tools.'
Seurat_v5:
  python_version: ''
  conda_channels:
  - conda-forge
  - bioconda
  conda_packages:
  - r-base>=4.2
  - r-seurat>=5.0
  - r-signac
  - r-dplyr
  - r-ggplot2
  - r-glue
  - bioconductor-hdf5array
  - bioconductor-rhdf5
  - r-seuratdisk
  - r-biocmanager
  - r-hdf5r
  pip_packages: []
  pip_git: []
  package_source: 'CRAN: Seurat 5 and Signac; Bioconductor: HDF5Array and rhdf5.'
  difficulty: R
  verified_working: true
  caveats: 'R only. Seurat must be version 5: the bridge-integration functions the script calls (PrepareBridgeReference, FindBridgeTransferAnchors) exist only there. Signac provides CreateChromatinAssay, RunTFIDF and FindTopFeatures. The script runs SCTransform; glmGamPoi is optional and speeds it up. The script loads neither SeuratDisk nor hdf5r.'
scBridge:
  python_version: '3.10'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch==1.13.0
  - scanpy==1.9.1
  - scikit-learn==1.1.3
  - scipy==1.9.3
  - seaborn==0.12.0
  - harmonypy==0.0.6
  - matplotlib==3.5.3
  - pandas==1.4.4
  - anndata
  - h5py
  pip_git: []
  package_source: 'No installable package: the code (main_scBridge.py, data_utils.py, model_utils.py, eval_utils.py) is vendored in tools_scripts/scBridge/; upstream XLearning-SCU/scBridge.'
  difficulty: verified
  verified_working: true
  caveats: 'Pins follow upstream''s environment.yml (Python 3.10, torch 1.13.0, scanpy 1.9.1, numpy 1.23). numpy<2: data_utils.py uses np.mat, removed in numpy 2.0. A CUDA build of torch is required: the scripts call .cuda() unconditionally. harmonypy is needed by scanpy.external.pp.harmony_integrate in eval_utils.py.'
totalVI:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools
  - muon
  - scanpy
  - anndata
  - h5py
  - numpy<2
  - pandas
  - scipy
  - torch
  - seaborn
  - scrublet
  pip_git: []
  package_source: 'PyPI: scvi-tools. totalVI is scvi.model.TOTALVI; there is no separate totalVI package.'
  difficulty: verified
  verified_working: true
  caveats: numpy<2 is a precaution for the scvi-tools/scanpy stack; the scripts use no API removed in numpy 2.0. torch, seaborn and scrublet are imported only by main_totalVI_imputation.py; scrublet is never called but must be installed for the import to succeed. muon is imported by neither script.
MultiVI:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools==0.20.3
  - muon
  - mudata
  - scanpy
  - anndata
  - h5py
  - numpy<2
  - pandas
  - scipy
  - torch
  - matplotlib
  pip_git: []
  package_source: 'PyPI: scvi-tools. MultiVI is scvi.model.MULTIVI; the entrypoint main_MultiVI.py and its util.py are in tools_scripts/MultiVI/.'
  difficulty: old-scvi
  verified_working: false
  caveats: 'scvi-tools==0.20.3: the script calls model.get_accessibility_estimates(), which scvi-tools 1.x renamed get_normalized_accessibility(). numpy<2: util.py uses np.mat, removed in numpy 2.0. The accelerator argument in util.py is commented out, so training runs on the scvi-tools default device.'
Cobolt:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - scipy
  - torch
  - h5py
  - pandas
  - scikit-learn
  - umap-learn
  - python-igraph
  - leidenalg
  - xgboost
  - seaborn
  pip_git:
  - git+https://github.com/epurdom/cobolt.git#egg=cobolt
  package_source: 'GitHub: git+https://github.com/epurdom/cobolt.git. The PyPI package named cobolt is an unrelated project.'
  difficulty: verified
  verified_working: true
  caveats: 'Install cobolt from GitHub: `pip install cobolt` fetches an unrelated package (a cobalt.tools API wrapper that requires Python >=3.12). Upstream''s setup.py pins no versions; numpy<2 is a precaution for torch, scipy and numba (installed with umap-learn).'
scMVP:
  python_version: '3.7'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
