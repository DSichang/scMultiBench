# Per-method environment recipes, written by hand. multibench.engine.registry.load()
# attaches each entry to its method as env_spec; read one with mtb.env.recipe(method).
SCALEX:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scalex
  - scanpy
  - h5py
  - anndata
  - numpy<2
  pip_git: []
  package_source: 'PyPI: scalex (upstream jsxlei/SCALEX); installs torch as a dependency.'
  difficulty: verified
  verified_working: true
  caveats: numpy<2 is a precaution for the scanpy/torch stack; main_SCALEX.py uses no API removed in numpy 2.0.
Multigrate:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools<0.20
  - multigrate==0.0.2
  - muon
  - numpy<2
  - scanpy
  - anndata
  - pandas
  - h5py
  - scipy
  pip_git: []
  package_source: 'PyPI: multigrate==0.0.2 (upstream theislab/multigrate).'
  difficulty: old-scvi
  verified_working: true
  caveats: 'scvi-tools<0.20: multigrate 0.0.2 imports scvi._compat, which raises DeprecationWarning on import from scvi-tools 0.20 (the module is deleted in 1.1). numpy<2: the mosaic scripts use np.mat, removed in numpy 2.0. multigrate 0.0.2 requires Python >=3.9,<3.11. muon provides the ADT CLR normalization (muon.prot.pp.clr); torch is installed through scvi-tools.'
Seurat_v5:
  python_version: ''
  conda_channels:
  - conda-forge
  - bioconda
  conda_packages:
  - r-base>=4.2
  - r-seurat>=5.0
  - r-signac
  - r-dplyr
  - r-ggplot2
  - r-glue
  - bioconductor-hdf5array
  - bioconductor-rhdf5
  - r-seuratdisk
  - r-biocmanager
  - r-hdf5r
  pip_packages: []
  pip_git: []
  package_source: 'CRAN: Seurat 5 and Signac; Bioconductor: HDF5Array and rhdf5.'
  difficulty: R
  verified_working: true
  caveats: 'R only. Seurat must be version 5: the bridge-integration functions the script calls (PrepareBridgeReference, FindBridgeTransferAnchors) exist only there. Signac provides CreateChromatinAssay, RunTFIDF and FindTopFeatures. The script runs SCTransform; glmGamPoi is optional and speeds it up. The script loads neither SeuratDisk nor hdf5r.'
scBridge:
  python_version: '3.10'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch==1.13.0
  - scanpy==1.9.1
  - scikit-learn==1.1.3
  - scipy==1.9.3
  - seaborn==0.12.0
  - harmonypy==0.0.6
  - matplotlib==3.5.3
  - pandas==1.4.4
  - anndata
  - h5py
  pip_git: []
  package_source: 'No installable package: the code (main_scBridge.py, data_utils.py, model_utils.py, eval_utils.py) is vendored in tools_scripts/scBridge/; upstream XLearning-SCU/scBridge.'
  difficulty: verified
  verified_working: true
  caveats: 'Pins follow upstream''s environment.yml (Python 3.10, torch 1.13.0, scanpy 1.9.1), except numpy: upstream pins 1.23.3 and this recipe only requires numpy<2, because data_utils.py uses np.mat, removed in numpy 2.0. A CUDA build of torch is required: the scripts call .cuda() unconditionally. harmonypy is needed by scanpy.external.pp.harmony_integrate in eval_utils.py.'
totalVI:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools
  - muon
  - scanpy
  - anndata
  - h5py
  - numpy<2
  - pandas
  - scipy
  - torch
  - seaborn
  - scrublet
  pip_git: []
  package_source: 'PyPI: scvi-tools. totalVI is scvi.model.TOTALVI; there is no separate totalVI package.'
  difficulty: verified
  verified_working: true
  caveats: numpy<2 is a precaution for the scvi-tools/scanpy stack; the scripts use no API removed in numpy 2.0. torch, seaborn and scrublet are imported only by the second upstream script in tools_scripts/totalVI/, not by main_totalVI.py, which the package runs; scrublet is never called but must be installed for the import to succeed. muon is imported by neither script.
MultiVI:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scvi-tools==0.20.3
  - muon
  - mudata
  - scanpy
  - anndata
  - h5py
  - numpy<2
  - pandas
  - scipy
  - torch
  - matplotlib
  pip_git: []
  package_source: 'PyPI: scvi-tools. MultiVI is scvi.model.MULTIVI; the entrypoint main_MultiVI.py and its util.py are in tools_scripts/MultiVI/.'
  difficulty: old-scvi
  verified_working: false
  caveats: 'scvi-tools==0.20.3 is the version in the lockfile env scmb_multivi. util.py calls model.get_accessibility_estimates(), which scvi-tools 1.3.1 renamed get_normalized_accessibility(). numpy<2: util.py uses np.mat, removed in numpy 2.0. The accelerator argument in util.py is commented out, so training runs on the scvi-tools default device.'
Cobolt:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - scipy
  - torch
  - h5py
  - pandas
  - scikit-learn
  - umap-learn
  - python-igraph
  - leidenalg
  - xgboost
  - seaborn
  pip_git:
  - git+https://github.com/epurdom/cobolt.git#egg=cobolt
  package_source: 'GitHub: git+https://github.com/epurdom/cobolt.git. The PyPI package named cobolt is an unrelated project.'
  difficulty: verified
  verified_working: true
  caveats: 'Install cobolt from GitHub: `pip install cobolt` fetches an unrelated package (a cobalt.tools API wrapper that requires Python >=3.12). Upstream''s setup.py pins no versions. numpy<2 alone is not enough: the lockfile env scmb_cobolt3 holds numpy 1.21.6 because np.quantile on an np.matrix, reached through filter_features(), fails under numpy >= 1.22.'
scMVP:
  python_version: '3.7'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch
  - scanpy
  - anndata>=0.7
  - h5py
  - pandas
  - scikit-learn==0.22.2
  - numba>=0.48
  - scipy
  - loompy
  - tqdm
  - matplotlib
  - hyperopt==0.1.2
  - xlrd==1.2.0
  pip_git:
  - git+https://github.com/bm2-lab/scMVP.git
  package_source: Vendored in tools_scripts/scMVP/scMVP/ (setup.py, package scMVP 0.0.1); upstream GitHub bm2-lab/scMVP, not on PyPI. Install the vendored copy with `pip install -e`, or use the git URL.
  difficulty: verified
  verified_working: true
  caveats: 'numpy<2: main_scMVP.py uses np.mat, removed in numpy 2.0. scikit-learn==0.22.2, hyperopt==0.1.2 and xlrd==1.2.0 are pinned by scMVP''s setup.py, which targets Python 3.7. main_scMVP.py hardcodes use_cuda = True. It writes .mtx and .txt intermediates into the directory of the input .h5 files, so that directory must be writable.'
scMM:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch
  - torchvision
  - torchnet
  - pyro-ppl
  - pandas
  - scipy
  - scikit-learn
  - umap-learn
  - h5py
  - matplotlib
  - seaborn
  pip_git: []
  package_source: 'No installable package: the code (main_scMM.py, models/, datasets.py, objectives.py, utils.py, vis.py) is vendored in tools_scripts/scMM/; upstream kodaim1115/scMM.'
  difficulty: easy
  verified_working: false
  caveats: 'numpy<2: main_scMM.py uses np.mat, removed in numpy 2.0. The models import torchnet (torchnet.dataset), pyro-ppl (ZeroInflatedNegativeBinomial), torchvision and the local vis.py, which imports matplotlib, seaborn and umap-learn, so all of these are required. The lockfile env scmb_scmm2 runs it on Python 3.7 with torch 1.7.1, torchvision 0.8.2 and torchnet 0.0.4. Runs on the GPU when one is available, otherwise on CPU (--no_cuda forces CPU). main_scMM.py writes a scMM_data/ directory (count.mtx plus barcode and feature lists) next to each input file, so the input directory must be writable.'
scMDC:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - numpy<2
  - torch
  - scanpy
  - h5py
  - scikit-learn
  - scipy
  - pandas
  - munkres
  pip_git: []
  package_source: 'No installable package: the code (main_scMDC.py, scMDC_batch.py, layers.py, utils.py, preprocess.py) is vendored in tools_scripts/scMDC/; upstream xianglin226/scMDC.'
  difficulty: easy
  verified_working: false
  caveats: 'numpy<2: main_scMDC.py uses np.mat, removed in numpy 2.0. munkres is imported by utils.py.'
scMoMaT:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scmomat
  - torch
  - h5py
  - numpy<2
  - scipy
  - pandas
  - scikit-learn
  - umap-learn
  - leidenalg
  - matplotlib
  pip_git: []
  package_source: 'PyPI: scmomat (upstream PeterZZQ/scMoMaT).'
  difficulty: verified
  verified_working: true
  caveats: scmomat requires numpy>=1.19.5, torch>=1.11 and Python>=3.8.10, and installs scikit-learn, umap-learn, leidenalg and matplotlib itself. numpy<2 is a precaution for the torch/scipy stack. Runs on the GPU when one is available, otherwise on CPU.
moETM:
  python_version: '3.9'
  conda_channels:
  - conda-forge
  conda_packages: []
  pip_packages:
  - numpy==1.21.4
  - scipy==1.7.1
  - pandas==1.3.4
  - scanpy==1.9.1
  - anndata==0.8.0
  - matplotlib==3.4.3
  - scikit-learn==1.3.0
  - psutil==5.9.1
  - scib==1.0.5
  - h5py
  - joblib
  - torch==1.11.0
  - leidenalg
  - louvain
  pip_git: []
  package_source: 'No installable package: the code (the moETM/ subpackage, utils.py, dataloader.py, eval_utils.py) is vendored in tools_scripts/moETM/; upstream manqizhou/moETM.'
  difficulty: old-scvi
  verified_working: false
  caveats: 'Pins follow upstream''s requirements.txt and README (Python 3.9, torch 1.11.0); its sklearn==1.3.0 entry is installed as scikit-learn==1.3.0. numpy must stay below 2: utils.py uses np.Inf, removed in numpy 2.0. eval_utils.py imports spmatrix from scipy.sparse.csr, a deprecated namespace that still resolves (removal is announced for SciPy 2.0), so scipy==1.7.1 is upstream''s pin and not a hard bound. eval_utils.py also imports scib at module level, so scib is required although the entrypoints leave evaluate() commented out. h5py (imported by the scripts) and joblib (used by eval_utils.py) are missing from upstream''s requirements.txt; leidenalg and louvain serve the clustering in eval_utils.py. A CUDA build of torch is required: the model and data loader call .cuda() with no CPU fallback. For a CUDA version other than the one in PyPI''s torch 1.11.0 wheel, install from the PyTorch wheel index (e.g. pip install torch==1.11.0+cu113 --extra-index-url https://download.pytorch.org/whl/cu113).'
MIRA:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - mira-multiome
  - scanpy
  - anndata
  - h5py
  - scipy
  - numpy<2
  - leidenalg
  pip_git: []
  package_source: 'PyPI: mira-multiome (imported as mira); installs torch and pyro-ppl. The PyPI package named mira is an unrelated project.'
  difficulty: blocked-script
  verified_working: false
  caveats: 'The environment builds, but main_MIRA.py does `from logger import *` and tools_scripts/MIRA/ contains no logger.py, so the script fails at import until one is supplied. numpy<2: mira-multiome requires torch<=2.0, which is built against numpy 1.x. --acc defaults to gpu; pass --acc cpu to train without one.'
Concerto:
  python_version: '3.8'
  conda_channels:
  - conda-forge
  conda_packages: []
  pip_packages:
  - tensorflow==2.4.1
  - numpy==1.19.5
  - scanpy==1.7.1
  - pandas==1.1.5
  - scipy==1.5.4
  - scikit-learn==0.24.2
  - h5py==2.10.0
  - umap-learn==0.5.1
  - loompy==3.0.6
  - openTSNE==0.4.4
  - Pillow==8.4.0
  - anndata
  - protobuf<3.20
  pip_git: []
  package_source: 'No installable package: the code (concerto_function5_3.py and the bgi/ package) is vendored in tools_scripts/Concerto/; upstream melobio/Concerto-reproducibility.'
  difficulty: old-tensorflow
  verified_working: false
  caveats: Pins follow upstream's requirements.txt (TensorFlow 2.4.1, numpy 1.19.5, scanpy 1.7.1, h5py 2.10.0); TensorFlow 2.4.1 itself requires numpy~=1.19.2. Upstream used Python 3.6; this recipe uses 3.8, the newest Python with TensorFlow 2.4.1 wheels (x86-64 only). protobuf<3.20 avoids the descriptor error TensorFlow 2.4 raises with newer protobuf. A GPU is optional.
Matilda:
  python_version: '3.7'
  conda_channels:
  - conda-forge
  - pytorch
  - nvidia
  conda_packages:
  - python=3.7
  - pytorch=1.9.1
  - torchvision=0.10.1
  - cudatoolkit=11.1
  pip_packages:
  - numpy==1.19.5
  - scipy==1.7.1
  - pandas==1.3.4
  - h5py==3.1.0
  - scanpy==1.8.2
  - captum==0.4.1
  - tqdm==4.62.3
  - pillow==8.4.0
  pip_git: []
  package_source: 'No installable package: the upstream scripts are vendored in tools_scripts/Matilda/; upstream PYangLab/Matilda.'
  difficulty: old-scvi
  verified_working: false
  caveats: This recipe builds the environment of the upstream scripts, following upstream's environment_matilda.yaml (Python 3.7, pytorch 1.9.1 with cudatoolkit 11.1). captum==0.4.1 is added because main_matilda_train.py and main_matilda_task.py import captum.attr and the upstream yaml omits it. The scripts default to --device cuda; for --device cpu install a CPU build of pytorch 1.9.1 and drop cudatoolkit (the only option on macOS, which has no CUDA build). multibench runs Matilda through the matilda-sc package (engine/drivers/run_matilda.py), which this recipe does not install; the lockfile env `matilda` does. Tagged old-scvi because it needs its own env with old pins; it does not depend on scvi-tools.
VIMCCA:
  python_version: '3.9'
  conda_channels: []
  conda_packages: []
  pip_packages:
  - scbean
  - tensorflow==2.8.0
  - tensorflow-probability==0.16.0
  - astunparse
  - keras==2.8.0
  - protobuf<3.20
  - numpy<2
  - scanpy
  - anndata
  - h5py
  - scipy
  - pandas
  - python-igraph
  - louvain
  pip_git: []
  package_source: 'PyPI: scbean. VIMCCA is scbean.model.vimcca; there is no separate VIMCCA package.'
  difficulty: old-tensorflow
  verified_working: true
  caveats: scbean 0.5.6 declares tensorflow==2.4.0 and keras==2.3.1; TensorFlow 2.4 has no Python 3.9 wheels, so this recipe pins tensorflow==2.8.0 with the matching keras==2.8.0 and tensorflow-probability==0.16.0. Newer TensorFlow releases removed tensorflow.python.training.tracking.graph_view, which breaks scbean. astunparse is needed by TensorFlow 2.8 at import, protobuf<3.20 avoids its 'Descriptors cannot be created directly' error, and numpy<2 is required by TensorFlow 2.8.
VIPCCA:
  python_version: '3.8'
  conda_channels:
  - conda-forge
  conda_packages:
  - python=3.8
  pip_packages:
  - vipcca
  - tensorflow==2.8.0
  - keras==2.8.0
  - protobuf<3.20
  - numpy<2
  - scanpy
  - anndata
  - scipy
  - pandas
  - h5py
  - python-igraph
  - louvain
  pip_git: []
  package_source: 'PyPI: vipcca (upstream jhu99/vipcca).'
  difficulty: old-tensorflow
  verified_working: true
  caveats: 'vipcca 0.2.7 declares tensorflow==2.4.0; this recipe pins tensorflow==2.8.0, with keras==2.8.0 because vipcca imports standalone keras, which must match the TensorFlow minor version, and protobuf<3.20, which TensorFlow 2.8 needs. numpy<2: main_VIPCCA.py uses np.mat, removed in numpy 2.0. TensorFlow 2.8.0 has no macOS arm64 wheel; use tensorflow-macos==2.8.0 there, or an x86-64 environment.'
SMILE:
