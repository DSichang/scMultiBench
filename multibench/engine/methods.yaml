methods:
  - id: SCALEX
    language: python
    tasks: [clustering, batch]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/SCALEX/main_SCALEX.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Multigrate
    language: python
    tasks: [clustering, batch]
    atac: peak
    status: verified
    variants:
      - when: {category: mosaic, modalities: [rna1, rna2, adt2, adt3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_adt.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: adt2, flag: "--path3"}
          - {role: adt3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.0001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_atac.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: atac2, flag: "--path3"}
          - {role: atac3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_paired_integration.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, bs: 256, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Seurat_v5
    language: R
    tasks: [clustering, batch]
    atac: peak
    status: verified
    variants:
      # Bridge integration. LD_PRELOAD supplies the R CXXABI (else "namespace load
      # failed for Seurat"). sctransform exports ~520 MiB of globals to `future`
      # workers, over the 500 MiB default, so R_FUTURE_GLOBALS_MAXSIZE is raised
      # (`future` reads it at load). D27's peak ids are already chr:start-end, so
      # no normalize_peaks.
      - when: {category: diagonal, modalities: [rna, atac_peak]}
        entrypoint: tools_scripts/Seurat_v5/main_Seurat_v5.Rmd
        language: R
        run_env:
          LD_PRELOAD: /media/disk2/Sichang/.conda/envs/env_sciPENN/lib/libstdc++.so.6
          R_FUTURE_GLOBALS_MAXSIZE: "2147483648"
        args:
          - {role: rna}
          - {role: rna}
          - {role: atac_peak}
          - {role: atac_peak}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: scBridge
    language: python
    tasks: [clustering, batch, classification]
    atac: gene_activity
    status: verified
    # GPU: main_scBridge.py:42 `ce_weight.cuda()` and :46 `Net(...).cuda()` are
    # unconditional (no flag, no is_available() fallback; model_utils.py:52-219
    # .cuda() throughout) -> refused up front on a host without a GPU.
    requires_gpu: true
    gpu_evidence: tools_scripts/scBridge/main_scBridge.py:46
    variants:
      # scBridge takes the dataset directory plus bare file names relative to it
      # (upstream: --data_path="../D27/" --source_data="rna.h5" ...), not absolute
      # paths. The four file roles are therefore `const` names, which inputs_for
      # skips; only `data_dir` is resolved, so the modality set is empty, as for
      # the registration methods. source = labelled RNA reference, target = ATAC query.
      # One encoder takes both inputs (gene_num = source_data.shape[1],
      # data_utils.py:126), so atac_gas must be gene-aligned to rna (same feature
      # dimension), as for scJoint.
      - when: {category: diagonal, modalities: []}
        entrypoint: tools_scripts/scBridge/main_scBridge.py
        language: python
        args:
          - {role: data_dir, flag: "--data_path", eq: true}
          - {role: source_data, flag: "--source_data", const: "rna.h5", eq: true}
          - {role: target_data, flag: "--target_data", const: "atac_gas.h5", eq: true}
          - {role: source_cty, flag: "--source_cty", const: "rna_cty.csv"}
          - {role: target_cty, flag: "--target_cty", const: "atac_cty.csv"}
          - {role: out_dir, flag: "--save_path", eq: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: Prediction.csv}
        params: {umap_plot: true}    # store_false flag: passing it disables the in-script figure save, which crashes on its data-path-derived file name

  - id: totalVI
    language: python
    tasks: [batch, clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/totalVI/main_totalVI.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/totalVI/main_totalVI.py
        language: python
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, adt2, adt3], flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: MultiVI
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      # Mosaic layout = 3 batches: RNA-only, paired multiome (RNA + ATAC), ATAC-only;
      # in the D45 family these are rna1 / (rna2, atac2) / atac3.
      - when: {category: mosaic, modalities: [rna1, atac3, rna2, atac2]}
        entrypoint: tools_scripts/MultiVI/main_MultiVI.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}        # RNA-only batch
          - {role: atac3, flag: "--path2"}       # ATAC-only batch
          - {role: rna2, flag: "--pair_path1"}   # paired (multiome) RNA
          - {role: atac2, flag: "--pair_path2"}  # paired (multiome) ATAC
          - {role: out_dir, flag: "--save_path"}
        # cells in argument order (rna1, atac3, paired) only when the ATAC-only
        # and paired batches have the same size, as in D45: scvi stacks paired,
        # RNA, ATAC and main_MultiVI.py re-slices that by the ATAC-only count
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Cobolt
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/Cobolt/main_Cobolt.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: atac2, flag: "--path3"}
          - {role: atac3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {batch_size: 128, lr: 0.005}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMVP
    language: python
    tasks: [clustering]
    atac: peak
    status: verified
    variants:
      # The env's torch 1.9.1+cu102 has no sm_89 kernels: on such a GPU (e.g. RTX 4090)
      # multi_vae_attention fails with "CUDA error: no kernel image is available".
      # Forced to CPU, as for scMSI (scMM does the same with its own --no_cuda flag).
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/scMVP/main_scMVP.py
        language: python
        run_env:
          CUDA_VISIBLE_DEVICES: ""
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMM
    language: python
    tasks: [batch, clustering]
    # atac: role `atac_gas` is only the resolver alias for atac.h5; upstream main_scMM.py feeds the multiome peak matrix (D15/atac.h5) - see tools/atac_audit.py
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMM/main_scMM.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {model: rna_protein, no_cuda: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scMM/main_scMM.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {model: rna_atac, no_cuda: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/scMM/main_scMM.py
        language: python
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, adt2, adt3], flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {model: rna_protein, no_cuda: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMDC
    language: python
    tasks: [batch, clustering]
    # atac: upstream scMDC (ZINB on both views) was designed for gene-level ATAC; tools/atac_audit.py NEEDS_GENE_ACTIVITY
    atac: gene_activity
    status: verified
    # CPU switch: main_scMDC.py:58 `--device` defaults to 'cuda' and :171/:191/:199
    # call `.to(args.device)` unconditionally (scMDC_batch.py:164 gates only its
    # own .to() on is_available()) -> `--device cpu`. Applied by the runner on a
    # host without a GPU.
    cpu_params: {device: cpu}
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMDC/main_scMDC.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        params: {nbatch: 1}    # one input file -> one batch one-hot column; the default nbatch=2 fails with a dimension mismatch
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scMDC/main_scMDC.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/scMDC/main_scMDC.py
        language: python
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, adt2, adt3], flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {nbatch: 3}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMoMaT
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, adt, atac]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: atac, flag: "--path3", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, adt2, adt3], flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
      # Mosaic integration. main_scMoMaT.py takes --path1/--path2/--path3 with
      # nargs='+' plus --cty_path, so a per-batch modality pattern maps directly.
      - when: {category: mosaic, modalities: [rna1, rna2, rna3, adt1, atac2]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        args:
          # one slot per batch; "=None" marks a batch lacking that modality,
          # which is the form upstream's own example documents
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, "=None", "=None"], flag: "--path2"}
          - {roles: ["=None", atac2, "=None"], flag: "--path3"}
          - {roles: [cty1, cty2, cty3], flag: "--cty_path"}
          - {role: out_dir, flag: "--save_path"}
        # scMoMaT's primary output is a kNN graph, not an embedding; the 2-D UMAP
        # is secondary. Same as its vertical/cross variants.
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
  - id: moETM
    language: python
    tasks: [clustering]
    # atac: role `atac_gas` is only the resolver alias for atac.h5; upstream main_moETM_rna_atac.py:33 feeds the multiome peak matrix (D15/atac.h5) - see tools/atac_audit.py
    atac: peak
    status: verified
    # GPU: every minibatch goes `.to('cuda')` unconditionally - main_moETM_rna_adt.py:109-111
    # and main_moETM_rna_atac.py:124-126 - and the encoders are moved back with
    # `.cuda()` (:130-131 / :145-146); neither script has a device flag.
    requires_gpu: true
    gpu_evidence: tools_scripts/moETM/main_moETM_rna_adt.py:109
    setup_hint: "Runs in the `env_moETM` conda env."
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/moETM/main_moETM_rna_adt.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/moETM/main_moETM_rna_atac.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: MIRA
    language: python
    tasks: [clustering]
    atac: peak
    status: verified
    # main_MIRA.py needs a local logger.py that upstream does not ship - hence
    # env_specs' `blocked-script` tag and the `helpers` line below, which makes
    # scan say so instead of failing at import.
    setup_hint: "main_MIRA.py does `from logger import *` (line 9), but the public tools_scripts/MIRA/ holds only main_MIRA.py, so from a fresh checkout the script fails at import. The env (scmb_mira: pip install mira-multiome scanpy) builds normally. scan() reports the missing helper in files_reason; supply a logger.py next to main_MIRA.py to run it."
    variants:
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/MIRA/main_MIRA.py
        helpers: [logger.py]          # local module the script imports; not in the public repo
        language: python
        args:
          - {role: rna, flag: "--rna", repeat: true}
          - {role: atac, flag: "--atac", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: distancess.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: connectivities.h5, dataset: data}
  - id: Concerto
    language: python
    tasks: [batch, clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Concerto/main_Concerto.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/Concerto/main_Concerto.py
        language: python
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [adt1, adt2, adt3], flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Matilda
    language: python
    tasks: [classification, clustering, dimension_reduction]
    atac: gene_activity
    status: verified
    setup_hint: "Runs through the package driver engine/drivers/run_matilda.py, which uses Matilda's object API (`matilda-sc`, import `matilda`; https://pyanglab.github.io/Matilda/). The upstream main_matilda_train.py only trains and writes no embedding; the driver trains once, then runs dimension reduction + classification in one pass."
    variants:
      # --- CITE-seq (rna + adt) ---
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Matilda/main_matilda_train.py
        driver: engine/drivers/run_matilda.py
        language: python
        args:
          - {role: rna, flag: "--rna"}
          - {role: adt, flag: "--adt"}
          - {role: cty, flag: "--cty"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 30, seed: 1, device: auto}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: predict.csv}
      # --- SHARE-seq (rna + atac) ---
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/Matilda/main_matilda_train.py
        driver: engine/drivers/run_matilda.py
        language: python
        args:
          - {role: rna, flag: "--rna"}
          - {role: atac, flag: "--atac"}
          - {role: cty, flag: "--cty"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 30, seed: 1, device: auto}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: predict.csv}
  - id: VIMCCA
    language: python
    tasks: [clustering]
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/VIMCCA/main_VIMCCA_RNA_ADT.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/VIMCCA/main_VIMCCA_RNA_ATAC.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: VIPCCA
    language: python
    tasks: [batch, clustering]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/VIPCCA/main_VIPCCA.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: SMILE
    # GPU: main_SMILE.py:120 calls ReferenceSMILE_trainer, which builds
    # ContrastiveLoss (SMILE/SMILE.py:208) whose __init__ does
    # `torch.tensor(temperature).cuda()` unconditionally (SMILE/SMILE.py:20,22);
    # the trainer's own is_available() fallback (:207) never reaches that line.
    requires_gpu: true
    gpu_evidence: tools_scripts/SMILE/SMILE/SMILE.py:20
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      # Mosaic = reference (paired multiome) + query (RNA-only, ATAC-only); in the
      # D45 family: reference = (rna2, atac2), query = (rna1, atac3).
      - when: {category: mosaic, modalities: [rna2, atac2, rna1, atac3]}
        entrypoint: tools_scripts/SMILE/main_SMILE.py
        language: python
        cwd_at_script: true   # imports `from SMILE.SMILE import SMILE` (local package next to the entrypoint)
        args:
          - {role: rna2, flag: "--ref_path1"}     # reference = paired (multiome) RNA
          - {role: atac2, flag: "--ref_path2"}    # reference = paired (multiome) ATAC
          - {role: rna1, flag: "--query_path1"}   # query = RNA-only
          - {role: atac3, flag: "--query_path2"}  # query = ATAC-only
          - {role: out_dir, flag: "--save_path"}
        # cells in argument order: main_SMILE.py stacks the paired reference
        # ((z_a+z_b)/2), then query RNA, then query ATAC
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Portal
    language: python
    tasks: [batch, clustering]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
