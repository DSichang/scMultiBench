  - id: MultiVI
    language: python
    categories: [mosaic]
    tasks: [batch, clustering]
    status: verified
    variants:
      # Mosaic layout = 3 batches: RNA-only, paired (multiome) RNA+ATAC, ATAC-only.
      # On D45-family data those are rna1 / (rna2,atac2) / atac3. Use the concrete
      # file-name roles (like Cobolt/Multigrate below) so inputs_for resolves them
      # directly; the flag names preserve the upstream RNA/ATAC/pair semantics.
      # Upstream main_MultiVI.py canonical D45 cmd: --path1 rna1 --path2 atac3
      # --pair_path1 rna2 --pair_path2 atac2.
      - when: {category: mosaic, modalities: [rna1, atac3, rna2, atac2]}
        entrypoint: tools_scripts/MultiVI/main_MultiVI.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}        # RNA-only batch
          - {role: atac3, flag: "--path2"}       # ATAC-only batch
          - {role: rna2, flag: "--pair_path1"}   # paired (multiome) RNA
          - {role: atac2, flag: "--pair_path2"}  # paired (multiome) ATAC
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
