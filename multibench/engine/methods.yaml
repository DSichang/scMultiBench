  - id: scJoint
    # CPU switch: main_scJoint.py:21 declares `--use_cuda` with type=bool,
    # default True - argparse's bool() is truthy for any non-empty string
    # ("False" included), so only the empty string turns it off; :53-56 then
    # sets torch.device('cpu'). util/closs.py:57,108 gate their .cuda() on
    # use_gpu (= use_cuda); closs._one_hot (:10) is unconditional but has no
    # caller. Applied by the runner on a host without a GPU.
    cpu_params: {use_cuda: ""}
    language: python
    tasks: [batch, clustering]
    atac: gene_activity
    status: verified
    variants:
      # RNA + gene-activity ATAC with RNA labels (label transfer through a shared
      # encoder + KNN). Imports config/process_db/util as siblings -> cwd_at_script.
      # util/utils.py progress_bar reads os.popen('stty size') and crashes without a
      # terminal -> pty (the runner wraps the command in `script -q -e -c`). Input
      # size and class count are set from the data at run time. The shared encoder
      # needs atac_gas gene-aligned to rna (same feature dimension): D28 is, D27 is
      # not. embedding.h5 holds the rna cells, then the atac cells. Intermediates go
      # to ./output/<name>_embeddings.txt in the script directory
      # (main_scJoint.py:155), so that directory must be writable and runs must not
      # overlap.
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scJoint/main_scJoint.py
        language: python
        cwd_at_script: true
        pty: true
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: rna_cty, flag: "--cty_path1"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # Several RNA and ATAC batches: one RNA label file per RNA file. Output: the
      # RNA files in order, then the ATAC files (main_scJoint.py:150-175).
      - when: {category: diagonal, modalities: [rna1, rna2, rna3, atac_gas1, atac_gas2, atac_gas3]}
        entrypoint: tools_scripts/scJoint/main_scJoint.py
        language: python
        cwd_at_script: true
        pty: true
        args:
          - {roles: [rna1, rna2, rna3], flag: "--path1"}
          - {roles: [atac_gas1, atac_gas2, atac_gas3], flag: "--path2"}
          - {roles: [rna_cty1, rna_cty2, rna_cty3], flag: "--cty_path1"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: GLUE
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    setup_hint: "GLUE reads the GENCODE v43 human annotation (gencode.v43.chr_patch_hapl_scaff.annotation.gtf.gz, 53 MB) from <repo_path>/tools_scripts/GLUE/. The first run downloads it from ftp.ebi.ac.uk; on a host without network, put the file there. The wrapper runs the human script only, so mouse data is not supported through multibench."
    variants:
      # GLUE_human.py l.103-106 splits the peak names on ':' or '-' and casts
      # parts 2 and 3 to int, so chr_start_end names (D28's) fail at start ->
      # normalize_peaks rewrites the atac_peak names to chr:start-end.
      - when: {category: diagonal, modalities: [rna, atac_peak]}
        entrypoint: tools_scripts/GLUE/GLUE_human.py
        language: python
        cwd_at_script: true
        normalize_peaks: [atac_peak]
        downloads:
          - {file: gencode.v43.chr_patch_hapl_scaff.annotation.gtf.gz, url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_43/gencode.v43.chr_patch_hapl_scaff.annotation.gtf.gz"}
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_peak, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # Three RNA and three ATAC batches, fixed by the script
      # (GLUE_human_multibatch.py:86-108). Output: the RNA batches, then the ATAC batches.
      - when: {category: diagonal, modalities: [rna1, rna2, rna3, atac_peak1, atac_peak2, atac_peak3]}
        entrypoint: tools_scripts/GLUE/GLUE_human_multibatch.py
        language: python
        cwd_at_script: true
        normalize_peaks: [atac_peak1, atac_peak2, atac_peak3]
        downloads:
          - {file: gencode.v43.chr_patch_hapl_scaff.annotation.gtf.gz, url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_43/gencode.v43.chr_patch_hapl_scaff.annotation.gtf.gz"}
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: rna3, flag: "--path3"}
          - {role: atac_peak1, flag: "--path4"}
          - {role: atac_peak2, flag: "--path5"}
          - {role: atac_peak3, flag: "--path6"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}

