          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: SMILE
    language: python
    categories: [mosaic]
    tasks: [clustering]
    status: verified
    variants:
      # SMILE mosaic = reference (paired multiome) + query (RNA-only, ATAC-only).
      # On D45-family data: reference = (rna2, atac2), query = (rna1, atac3). Use the
      # concrete file-name roles so inputs_for resolves them directly; the flag names
      # preserve the ref/query semantics. Upstream main_SMILE.py canonical D45 cmd:
      # --ref_path1 rna2 --ref_path2 atac2 --query_path1 rna1 --query_path2 atac3.
      - when: {category: mosaic, modalities: [rna2, atac2, rna1, atac3]}
        entrypoint: tools_scripts/SMILE/main_SMILE.py
        language: python
        cwd_at_script: true   # imports `from SMILE.SMILE import SMILE` (local package next to the entrypoint)
        args:
          - {role: rna2, flag: "--ref_path1"}     # reference = paired (multiome) RNA
          - {role: atac2, flag: "--ref_path2"}    # reference = paired (multiome) ATAC
          - {role: rna1, flag: "--query_path1"}   # query = RNA-only
          - {role: atac3, flag: "--query_path2"}  # query = ATAC-only
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Portal
    language: python
    categories: [diagonal]
    tasks: [clustering]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/Portal/main_Portal.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: uniPort
    language: python
