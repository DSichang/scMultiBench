        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: MultiVI
