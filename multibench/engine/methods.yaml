        language: python
        cwd_at_script: true
        args:
          - {role: rna, flag: "--train_path1", repeat: true}
          - {role: atac_gas, flag: "--train_path2", repeat: true}
          - {role: rna_cty, flag: "--train_cty_path", repeat: true}
