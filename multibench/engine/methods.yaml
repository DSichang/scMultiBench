      # Transfer-anchor integration. Needs Seurat 4.3 + SeuratObject 4.1.x (v5
      # objects break RunCCA), hence its own env. Signac's CreateChromatinAssay
      # needs chr:start-end peak ids ->
      # normalize_peaks rewrites the atac_peak names.
      - when: {category: diagonal, modalities: [rna, atac_peak, atac_gas]}
        entrypoint: tools_scripts/Seurat_v3/main_Seurat_v3.Rmd
        language: R
        normalize_peaks: [atac_peak]
        args:
          - {role: rna}
          - {role: atac_peak}
          - {role: atac_gas}
          - {role: rna_cty}
          - {role: atac_cty}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: predict.csv}
  - id: Seurat_WNN
    language: R
    gpu_use: not used   # R; no CUDA call in the script
    tasks: [clustering]
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Seurat_v4/main_Seurat_v4.Rmd
        language: R
        args:
          - {role: rna}
          - {role: adt}
          - {role: atac, const: "NULL"}
          - {role: out_dir}
        output: {kind: graph, file: dist.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: idx.h5, dataset: data}
        cwd_at_script: true
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/Seurat_v4/main_Seurat_v4.Rmd
        language: R
        # sources util.R from the working directory, like the RNA + ADT variant
        cwd_at_script: true
        args:
          - {role: rna}
          - {role: adt, const: "NULL"}
          - {role: atac}
          - {role: out_dir}
        output: {kind: graph, file: dist.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: idx.h5, dataset: data}
