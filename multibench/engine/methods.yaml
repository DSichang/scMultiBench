          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - {id: scJoint, language: python, categories: [diagonal], tasks: [classification], status: declared}
  - id: GLUE
    language: python
    categories: [diagonal]
    tasks: [clustering]
    status: verified
    setup_hint: "runs in the `glue` env (scglue); needs a gencode GTF (gencode.v43.*.annotation.gtf.gz) symlinked into the run's out_dir. Verified end-to-end on D27 -> (21434, 50) embedding."
    variants:
      - when: {category: diagonal, modalities: [rna, atac_peak]}
        entrypoint: tools_scripts/GLUE/GLUE_human.py
