methods:
  - id: SCALEX
    language: python
    categories: [diagonal]
    tasks: [clustering, batch]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/SCALEX/main_SCALEX.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Multigrate
    language: python
    categories: [mosaic, vertical, cross]
    tasks: [clustering, batch]
    status: verified
    variants:
      - when: {category: mosaic, modalities: [rna1, rna2, adt2, adt3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_adt.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: adt2, flag: "--path3"}
          - {role: adt3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.0001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_atac.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: atac2, flag: "--path3"}
          - {role: atac3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_paired_integration.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, bs: 256, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Seurat_v5
    language: R
    categories: [diagonal]
    tasks: [clustering, batch]
    atac: peak
    status: verified
    variants:
      # Bridge/anchor integration via Seurat v5 (env liger, Seurat 5.4.0). Needs
      # LD_PRELOAD for the R CXXABI (else "namespace load failed for Seurat"), and
      # sctransform exports ~520MiB of globals to `future` workers, over the 500MiB
      # default -> raise R_FUTURE_GLOBALS_MAXSIZE (the `future` pkg reads this env
      # var at load). D27 peaks are colon-format (chr:start-end) so no normalize.
      # RUN-VERIFIED on D27.
      - when: {category: diagonal, modalities: [rna, atac_peak]}
        entrypoint: tools_scripts/Seurat_v5/main_Seurat_v5.Rmd
        language: R
        run_env:
          LD_PRELOAD: /media/disk2/Sichang/.conda/envs/env_sciPENN/lib/libstdc++.so.6
          R_FUTURE_GLOBALS_MAXSIZE: "2147483648"
        args:
          - {role: rna}
          - {role: rna}
          - {role: atac_peak}
          - {role: atac_peak}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: scBridge
    language: python
    categories: [diagonal]
    tasks: [clustering, batch, classification]
    atac: gene_activity
    needs_labels: true
    status: verified
    variants:
      # scBridge takes the dataset DIRECTORY plus BARE FILENAMES relative to it
      # (upstream: --data_path="../D27/" --source_data="rna.h5" --target_data="atac_gas.h5"
      # --source_cty "rna_cty.csv" --target_cty "atac_cty.csv"), NOT absolute paths.
      # So the four file roles are `const` bare names (inputs_for skips const args)
      # and only `data_dir` is resolved -> the sole input is the dataset dir, which
      # leaves the modality set empty, hence `modalities: []` (same shape the
      # spatial-registration data_dir methods use). source = labelled RNA reference,
      # target = ATAC query. RUN-VERIFIED on D28 (which has all four files).
      - when: {category: diagonal, modalities: []}
        entrypoint: tools_scripts/scBridge/main_scBridge.py
        language: python
        args:
          - {role: data_dir, flag: "--data_path", eq: true}
          - {role: source_data, flag: "--source_data", const: "rna.h5", eq: true}
          - {role: target_data, flag: "--target_data", const: "atac_gas.h5", eq: true}
          - {role: source_cty, flag: "--source_cty", const: "rna_cty.csv"}
          - {role: target_cty, flag: "--target_cty", const: "atac_cty.csv"}
          - {role: out_dir, flag: "--save_path", eq: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: Prediction.csv}
        params: {umap_plot: true}    # action=store_false: passing this DISABLES the in-script figure save, which would otherwise crash on data-path-derived filename

