        entrypoint: tools_scripts/uniPort/main_uniPort.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {seed: 1}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: sciCAN
    language: python
    categories: [diagonal]
