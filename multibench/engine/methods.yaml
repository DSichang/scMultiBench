  - {id: SPIRAL, language: python, categories: [cross], tasks: [registration], status: declared}
  - {id: GPSA, language: python, categories: [cross], tasks: [registration], status: declared}
  - {id: PASTE, language: python, categories: [cross], tasks: [registration], status: declared}
