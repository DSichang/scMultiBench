  - id: scJoint
    language: python
    categories: [diagonal]
    tasks: [batch, classification, clustering]
    atac: gene_activity
    status: verified
    variants:
      # Diagonal integration: RNA + gene-activity ATAC with RNA cell-type labels
      # (transfers labels to ATAC via a shared encoder + KNN). Imports
      # config/process_db/util as siblings -> cwd_at_script. util/utils.py
      # progress_bar reads os.popen('stty size') and crashes without a terminal
      # -> pty: true (runner wraps in `script -q -e -c`). Feature dim / #classes
      # are derived from the data at runtime (args override Config), so no dims
      # are hardcoded here; requires GENE-ALIGNED atac_gas (== rna feature dim,
      # shared encoder) -> D28 (D27's atac_gas is not aligned). Writes intermediate
