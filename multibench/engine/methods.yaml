        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
      # rna1 | rna2 + atac2 | atac3
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {roles: [rna1, rna2, "=None"], flag: "--path1"}
          - {roles: ["=None", "=None", "=None"], flag: "--path2"}
