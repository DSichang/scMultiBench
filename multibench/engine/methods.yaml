  - id: UnitedNet
    language: python
    tasks: [clustering]
    # GPU: main_UnitedNet.py:32 hardcodes `device = "cuda:0"` (passed to
    # UnitedNet(..., device=device) at :217, which .to()s the model onto it,
    # src/interface.py:25); the argparse (:15-21) has no device flag.
    requires_gpu: true
    gpu_evidence: tools_scripts/UnitedNet/main_UnitedNet.py:32
    # atac: not in tools/atac_audit.py; inferred from the upstream script's reference atacseq config (main_UnitedNet.py:174, ATAC input dim 13634 = gene-level features, is_binary_input False). Generic MLP encoders - runs on either representation
    # the benchmark runs this method on peak matrices: its RNA + ATAC datasets (D12-D22,
    # D56) hold peaks only, and the script takes any feature matrix
    atac: peak
    status: verified
    variants:
      # Supervised paired RNA + ATAC integration (matched cells + labels).
      # main_UnitedNet.py imports its local src/ package -> cwd_at_script. For one
      # paired dataset train == test, so every cell is embedded. Outputs carry
      # --index (default 1): embedding1.h5 and predict1.csv.
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/UnitedNet/main_UnitedNet.py
        language: python
        cwd_at_script: true
        args:
          - {role: rna, flag: "--train_path1", repeat: true}
          - {role: atac_gas, flag: "--train_path2", repeat: true}
          # cty.csv, as for Matilda: vertical cells are paired, so the one
          # label file labels the RNA cells (an older rna_cty.csv still resolves)
          - {role: cty, flag: "--train_cty_path", repeat: true}
          - {role: rna, flag: "--test_path1", repeat: true}
          - {role: atac_gas, flag: "--test_path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding1.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: predict1.csv}
      # Several batches: train and test on the same files, as in the vertical variant.
      - when: {category: cross, modalities: [rna1, rna2, rna3, atac1, atac2, atac3]}
        entrypoint: tools_scripts/UnitedNet/main_UnitedNet.py
        language: python
        cwd_at_script: true
        args:
          - {roles: [rna1, rna2, rna3], flag: "--train_path1"}
          - {roles: [atac1, atac2, atac3], flag: "--train_path2"}
          - {roles: [cty1, cty2, cty3], flag: "--train_cty_path"}
          - {roles: [rna1, rna2, rna3], flag: "--test_path1"}
          - {roles: [atac1, atac2, atac3], flag: "--test_path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding1.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: predict1.csv}

  - id: iPOLNG
    # GPU: main_iPOLNG.py:12 picks the default tensor type with an
    # is_available() fallback, but :41 then casts both inputs with
    # `.type("torch.cuda.FloatTensor")` unconditionally, which a CPU-only torch
    # cannot do ("Torch not compiled with CUDA enabled"). No flag.
    requires_gpu: true
    gpu_evidence: tools_scripts/iPOLNG/main_iPOLNG.py:41
    language: python
    tasks: [clustering]
    # atac: role `atac_gas` is only the resolver alias for atac.h5; upstream main_iPOLNG.py:21 feeds the multiome peak matrix (D15/atac.h5) - see tools/atac_audit.py
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/iPOLNG/main_iPOLNG.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: StabMap
    language: R
    gpu_use: not used   # R; no CUDA call in the script or the driver
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      # Cross integration. main_StabMap.Rmd only defines run_StabMap() and helpers
      # (no top-level call), so the package driver engine/drivers/run_stabmap.R
      # source()s the unmodified .Rmd and calls run_StabMap(file_paths, save_path,
      # reference).
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {role: rna3, flag: "--rna"}
          - {role: adt1, flag: "--adt"}
          - {role: adt2, flag: "--adt"}
          - {role: adt3, flag: "--adt"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data3}
        # stabMap() rbinds the reference dataset's embedding before the others
        # (StabMap R/stabMap.R, embedding_list filled from all_shortest_paths
        # from the reference); util.R:184 names the batches data1..dataN. D52:
        # ARI .688 for cty3, cty1, cty2 vs .0006 for cty1, cty2, cty3.
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      # Mosaic integration. Same driver as cross; run_stabmap.R accepts
      # repeatable --rna/--adt/--atac, and util.R names datasets data1..dataN one
      # per batch. D46 is rna1+adt1 | rna2+atac2 | rna3, so data1 is a bridge
      # batch carrying two modalities.
      - when: {category: mosaic, modalities: [rna1, rna2, rna3, adt1, atac2]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          # one slot per batch, in batch order; "=None" marks a batch that
          # lacks the modality. StabMap indexes these by batch, so a collapsed
          # list would pair adt1 with the wrong batch.
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {role: rna3, flag: "--rna"}
          - {role: adt1, flag: "--adt"}
          - {roles: ["=None"], flag: "--adt"}
          - {roles: ["=None"], flag: "--adt"}
          - {roles: ["=None"], flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {roles: ["=None"], flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data1}
        # reference batch first, as in the cross variant (D46: cty1, cty2, cty3)
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: mosaic, modalities: [rna1, rna2, adt2, adt3]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {roles: ["=None"], flag: "--rna"}
          - {roles: ["=None"], flag: "--adt"}
          - {role: adt2, flag: "--adt"}
          - {role: adt3, flag: "--adt"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data2}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {roles: ["=None"], flag: "--rna"}
          - {roles: ["=None"], flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {role: atac3, flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data2}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: mosaic, modalities: [rna1, rna2, adt1, adt3, atac2]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {roles: ["=None"], flag: "--rna"}
          - {role: adt1, flag: "--adt"}
          - {roles: ["=None"], flag: "--adt"}
          - {role: adt3, flag: "--adt"}
          - {roles: ["=None"], flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {roles: ["=None"], flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data1}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: cross, modalities: [rna1, rna2, rna3, atac1, atac2, atac3]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {role: rna3, flag: "--rna"}
          - {role: atac1, flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {role: atac3, flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data3}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: cross, modalities: [adt1, adt2, atac1, atac2]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: adt1, flag: "--adt"}
          - {role: adt2, flag: "--adt"}
          - {role: atac1, flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data2}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}
      - when: {category: cross, modalities: [rna1, rna2, adt1, adt2, atac1, atac2]}
        entrypoint: tools_scripts/StabMap/main_StabMap.Rmd
        language: R
        driver: engine/drivers/run_stabmap.R
        args:
          - {role: rna1, flag: "--rna"}
          - {role: rna2, flag: "--rna"}
          - {role: adt1, flag: "--adt"}
          - {role: adt2, flag: "--adt"}
          - {role: atac1, flag: "--atac"}
          - {role: atac2, flag: "--atac"}
          - {role: out_dir, flag: "--save_path"}
          - {role: reference, flag: "--reference", const: data2}
        output: {kind: embedding, file: embedding.h5, dataset: data, cell_order: reference_first}

  - id: UINMF
    language: R
    gpu_use: not used   # R; no CUDA call in the script
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/UINMF/main_UINMF_vertical.Rmd
        language: R
        args:
          - {role: rna}
          - {role: adt}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, adt1, adt2]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross.Rmd
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: adt1}
          - {role: adt2}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # main_UINMF_cross.Rmd takes two batches and indexes batch 2's second
      # modality by batch 1's features, so it cannot run a layout whose batches
      # hold different second modalities. The mosaic variant below uses the
      # benchmark's own script for that layout.
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/UINMF/main_UINMF_vertical.Rmd
        language: R
        args:
          - {role: rna}
          - {role: atac}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, atac1, atac2]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross.Rmd
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: atac1}
          - {role: atac2}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # No RNA: peaks in the script's shared slots and ADT in the second-modality
      # slots, the order of the benchmark's last run of this layout (D58).
      - when: {category: cross, modalities: [adt1, adt2, atac1, atac2]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross.Rmd
        language: R
        args:
          - {role: atac1}
          - {role: atac2}
          - {role: adt1}
          - {role: adt2}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # Scripts of the benchmark's own runs that the public repository does not hold.
      # The package ships them (engine/helpers/UINMF/) and copies them next to the
      # public scripts before a run.
      - when: {category: vertical, modalities: [rna, adt, atac]}
        entrypoint: tools_scripts/UINMF/main_UINMF_vertical_3modality.Rmd
        helpers: [main_UINMF_vertical_3modality.Rmd]
        language: R
        args:
          - {role: rna}
          - {role: adt}
          - {role: atac}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, rna3, adt1, adt2, adt3]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross_2modality_3batch.Rmd
        helpers: [main_UINMF_cross_2modality_3batch.Rmd]
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: rna3}
          - {role: adt1}
          - {role: adt2}
          - {role: adt3}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # peaks in the script's second-modality slots, as the benchmark's RNA + ATAC runs
      - when: {category: cross, modalities: [rna1, rna2, rna3, atac1, atac2, atac3]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross_2modality_3batch.Rmd
        helpers: [main_UINMF_cross_2modality_3batch.Rmd]
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: rna3}
          - {role: atac1}
          - {role: atac2}
          - {role: atac3}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: cross, modalities: [rna1, rna2, adt1, adt2, atac1, atac2]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross_3modality_2batch.Rmd
        helpers: [main_UINMF_cross_3modality_2batch.Rmd]
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: adt1}
          - {role: adt2}
          - {role: atac1}
          - {role: atac2}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      # rna1 + adt1 | rna2 + atac2 | rna3 (D46, D47)
      - when: {category: mosaic, modalities: [rna1, rna2, rna3, adt1, atac2]}
        entrypoint: tools_scripts/UINMF/main_UINMF_cross_3modality_3batch_d46_d47.Rmd
        helpers: [main_UINMF_cross_3modality_3batch_d46_d47.Rmd]
        language: R
        args:
          - {role: rna1}
          - {role: rna2}
          - {role: rna3}
          - {role: adt1}
          - {role: atac2}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}


