methods:
  - id: SCALEX
    language: python
    categories: [diagonal]
    tasks: [clustering, batch]
    atac: gene_activity
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/SCALEX/main_SCALEX.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Multigrate
    language: python
    categories: [mosaic, vertical, cross]
    tasks: [clustering, batch]
    status: verified
    variants:
      - when: {category: mosaic, modalities: [rna1, rna2, adt2, adt3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_adt.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: adt2, flag: "--path3"}
          - {role: adt3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.0001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_mosaic_rna_atac.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: atac2, flag: "--path3"}
          - {role: atac3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Multigrate/main_Multigrate_paired_integration.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        params: {epochs: 200, bs: 256, lr: 0.001}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: Seurat_v5
    language: R
    categories: [diagonal]
    tasks: [clustering, batch]
    atac: peak
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_peak]}
        entrypoint: tools_scripts/Seurat_v5/main_Seurat_v5.Rmd
        language: R
        args:
          - {role: rna}
          - {role: rna}
          - {role: atac_peak}
          - {role: atac_peak}
          - {role: out_dir}
        output: {kind: embedding, file: embedding.h5, dataset: data}

  - id: scBridge
    language: python
    categories: [diagonal]
    tasks: [clustering, batch, classification]
    atac: gene_activity
    needs_labels: true
    status: verified
    variants:
      - when: {category: diagonal, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scBridge/main_scBridge.py
        language: python
        args:
          - {role: data_dir, flag: "--data_path", eq: true}
          - {role: source_data, flag: "--source_data", eq: true}
          - {role: target_data, flag: "--target_data", eq: true}
          - {role: source_cty, flag: "--source_cty"}
          - {role: target_cty, flag: "--target_cty"}
          - {role: out_dir, flag: "--save_path", eq: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        extra_outputs:
          - {kind: labels, file: Prediction.csv}
        params: {umap_plot: true}    # action=store_false: passing this DISABLES the in-script figure save, which would otherwise crash on data-path-derived filename

  # ---- declared stubs (discoverable; not yet wired) ----
  - id: totalVI
    language: python
    categories: [vertical, mosaic, cross]
    tasks: [clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/totalVI/main_totalVI.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: MultiVI
    language: python
    categories: [mosaic]
    tasks: [clustering]
    status: verified
    variants:
      # Mosaic layout = 3 batches: RNA-only, paired (multiome) RNA+ATAC, ATAC-only.
      # On D45-family data those are rna1 / (rna2,atac2) / atac3. Use the concrete
      # file-name roles (like Cobolt/Multigrate below) so inputs_for resolves them
      # directly; the flag names preserve the upstream RNA/ATAC/pair semantics.
      # Upstream main_MultiVI.py canonical D45 cmd: --path1 rna1 --path2 atac3
      # --pair_path1 rna2 --pair_path2 atac2.
      - when: {category: mosaic, modalities: [rna1, atac3, rna2, atac2]}
        entrypoint: tools_scripts/MultiVI/main_MultiVI.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}        # RNA-only batch
          - {role: atac3, flag: "--path2"}       # ATAC-only batch
          - {role: rna2, flag: "--pair_path1"}   # paired (multiome) RNA
          - {role: atac2, flag: "--pair_path2"}  # paired (multiome) ATAC
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Cobolt
    language: python
    categories: [mosaic]
    tasks: [clustering]
    status: verified
    variants:
      - when: {category: mosaic, modalities: [rna1, rna2, atac2, atac3]}
        entrypoint: tools_scripts/Cobolt/main_Cobolt.py
        language: python
        args:
          - {role: rna1, flag: "--path1"}
          - {role: rna2, flag: "--path2"}
          - {role: atac2, flag: "--path3"}
          - {role: atac3, flag: "--path4"}
          - {role: out_dir, flag: "--save_path"}
        params: {batch_size: 128, lr: 0.005}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMVP
    language: python
    categories: [vertical]
    tasks: [clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, atac]}
        entrypoint: tools_scripts/scMVP/main_scMVP.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMM
    language: python
    categories: [vertical]
    tasks: [clustering]
    status: declared
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMM/main_scMM.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {model: rna_protein, no_cuda: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scMM/main_scMM.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        params: {model: rna_atac, no_cuda: true}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMDC
    language: python
    categories: [vertical]
    tasks: [clustering]
    status: declared
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMDC/main_scMDC.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: adt, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        params: {nbatch: 1}    # single h5 source -> 1 batch one-hot col; default args.nbatch=2 produces 10797-vs-10796 dim mismatch
      - when: {category: vertical, modalities: [rna, atac_gas]}
        entrypoint: tools_scripts/scMDC/main_scMDC.py
        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac_gas, flag: "--path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: scMoMaT
    language: python
    categories: [vertical, mosaic, cross]
    tasks: [clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
      - when: {category: vertical, modalities: [rna, adt, atac]}
        entrypoint: tools_scripts/scMoMaT/main_scMoMaT.py
        language: python
        args:
          - {role: rna, flag: "--path1", repeat: true}
          - {role: adt, flag: "--path2", repeat: true}
          - {role: atac, flag: "--path3", repeat: true}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: graph, file: knn_indices.h5, dataset: data}
        extra_outputs:
          - {kind: graph, file: knn_dists.h5, dataset: data}
          - {kind: embedding, file: umap_embedding.h5, dataset: data}
  - id: moETM
    language: python
    categories: [vertical]
