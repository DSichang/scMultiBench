  - id: SMILE
    # GPU: main_SMILE.py:120 calls ReferenceSMILE_trainer, which builds
    # ContrastiveLoss (SMILE/SMILE.py:208) whose __init__ does
    # `torch.tensor(temperature).cuda()` unconditionally (SMILE/SMILE.py:20,22);
    # the trainer's own is_available() fallback (:207) never reaches that line.
    requires_gpu: true
    gpu_evidence: tools_scripts/SMILE/SMILE/SMILE.py:20
    language: python
    tasks: [batch, clustering]
    atac: peak
    status: verified
    variants:
      # Mosaic = reference (paired multiome) + query (RNA-only, ATAC-only); in the
      # D45 family: reference = (rna2, atac2), query = (rna1, atac3).
      - when: {category: mosaic, modalities: [rna2, atac2, rna1, atac3]}
        entrypoint: tools_scripts/SMILE/main_SMILE.py
        language: python
        cwd_at_script: true   # imports `from SMILE.SMILE import SMILE` (local package next to the entrypoint)
        args:
          - {role: rna2, flag: "--ref_path1"}     # reference = paired (multiome) RNA
          - {role: atac2, flag: "--ref_path2"}    # reference = paired (multiome) ATAC
          - {role: rna1, flag: "--query_path1"}   # query = RNA-only
          - {role: atac3, flag: "--query_path2"}  # query = ATAC-only
          - {role: out_dir, flag: "--save_path"}
        # cells in argument order: main_SMILE.py stacks the paired reference
        # ((z_a+z_b)/2), then query RNA, then query ATAC
        output: {kind: embedding, file: embedding.h5, dataset: data}
