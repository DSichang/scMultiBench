      # commandArgs: --train_path1/2 (rna/atac) --train_cty_path (labels)
      #              --test_path1/2 (rna/atac to embed) --save_path [--index].
      # Encoders size themselves from adata.shape[1], so no hardcoded dims. For a
      # single paired dataset train == test on the same data -> joint embedding of
      # all cells. Path args are nargs='+' (repeat) -> multi-batch cross possible later.
      # Output embedding{index}.h5 (default index=1) dataset "data" (cells x dim) +
      # predict1.csv (predicted labels). RUN-VERIFIED on D27 (paired multiome, 10717 cells).
