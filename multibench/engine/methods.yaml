        language: python
        args:
          - {role: rna, flag: "--path1"}
          - {role: atac, flag: "--path2"}
          - {role: rna_pair, flag: "--pair_path1"}
          - {role: atac_pair, flag: "--pair_path2"}
          - {role: out_dir, flag: "--save_path"}
        output: {kind: embedding, file: embedding.h5, dataset: data}
  - id: Cobolt
    language: python
