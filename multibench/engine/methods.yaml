    tasks: [dimension_reduction, classification]
    needs_labels: true
    status: declared
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/Matilda/main_matilda_train.py
        language: python
        args:
          - {role: rna, flag: "--rna"}
          - {role: adt, flag: "--adt"}
          - {role: cty, flag: "--cty"}
          - {role: out_dir, flag: "--save_path"}
        params: {device: cpu, batch_size: 64, epochs: 100}
        output: {kind: embedding, file: embedding.h5, dataset: data}
        run_env: {PYTHONPATH: tools_scripts/Matilda}
  - id: VIMCCA
    language: python
    categories: [vertical]
    tasks: [clustering]
    status: verified
    variants:
      - when: {category: vertical, modalities: [rna, adt]}
        entrypoint: tools_scripts/VIMCCA/main_VIMCCA_RNA_ADT.py
        language: python
