# Explicit method -> real installed conda env. Verified by import-testing the
# actual envs on the host; takes precedence over the generated `groups` below
# (whose scmb_* names are largely fictional / never built). [v]=deps verified to
# import; [broken]=correct target env but its import is broken (ABI/version) and
# needs a fix; R methods now on scmb_r (rliger/StabMap built); only Conos needs r-conos.
method_env:
  Seurat_v5: liger          # [v] Seurat 5 + Signac bridge stack
  Seurat_v3: scmb_seurat4b   # [v] Seurat 4.3.0.1 + SeuratObject 4.1.4 (5.x breaks RunCCA); clone of scmb_seurat4 w/ SeuratObject downgraded; RUN-VERIFIED D28
  Seurat_WNN: liger         # [v]
  MIRA: scmb_mira           # [v]
  Portal: scmb_torch_v2     # [v]
  totalVI: scmb_scvi        # [v] scvi-tools 1.3.3 TOTALVI
  MultiVI: scmb_multivi      # [v] dedicated env scvi-tools 0.20.3 (older API; RUN-VERIFIED on D45)
  scMSI: scmb_scmsi         # [v] dedicated torch 1.9.1+CPU; RUN-VERIFIED on D7 (D1 hits internal batch=1 BatchNorm; D7 cell count avoids it)
  scBridge: scmb_torch      # [v] generic torch+scanpy, RUN-VERIFIED on D28 (rna+atac_gas, gene-aligned, +harmonypy 0.0.9, --umap_plot disables figure)
  Concerto: scmb_concerto    # [v] uniout shim + openTSNE/faiss/sentencepiece (BERT stack)
  VIMCCA: scmb_vimcca       # [v] scbean==0.5.6 + TF2.4 + tfp0.12.2
  UnitedNet: unitednet      # [v] RUN-VERIFIED on D45 (train+test+labels)
  SPIRAL: spiral_environment # [v]
  MOFA2: MOFA2_env          # [v] R MOFA2 + RETICULATE_PYTHON=mofa_env_gpu/bin/python; RUN-VERIFIED on D2
  sciPENN: env_sciPENN       # [v] user existing env: torch 1.13.1+cu117, supports up to sm_86
  SMILE: env_sciPENN        # [v] anndata 0.8.0/scanpy 1.9.3/numpy 1.21.6 thread BOTH np.matrix-coerce + bytes-varnames needles; RUN-VERIFIED on D45 (32151x20)
  Matilda: matilda          # [v] user existing env: torch + matilda local imports OK
  scMM: scmb_scmm2          # [v] old stack: torch 1.7.1 + torchnet 0.0.4 (documented)
  scMDC: scmb_scmdc         # [v] numpy<2+torch+munkres, RUN-VERIFIED on D2 with --nbatch 1 (single-batch fix)
  sciCAN: scmb_scican       # [v] rebuilt +tensorflow+easydl; RUN-VERIFIED on D28 (gene-aligned atac_gas)
  Multigrate: scmb_multigrate2 # [v] fresh env: multigrate==0.0.2 + pinned torchmetrics<0.11/anndata<0.9/scanpy<1.10
  scJoint: scmb_scjoint     # [v] numpy<1.24 (np.float restored); needs pty (script -q); RUN-VERIFIED on D28
  VIPCCA: scmb_vipcca27     # [v] vipcca==0.2.7 (documented; tools+model import OK)
  iPOLNG: scmb_ipolng       # [v] fresh env: iPoLNG 0.0.2 + torch 1.11
  scMVP: scmb_scmvp4        # [v] conda py3.7 + pytorch 1.9.1 + numpy 1.19.5 + scanpy 1.8.2
  UINMF: scmb_r             # [v] fresh R env: rliger 2.2.1 (compiled from source)
  iNMF: scmb_r              # [v] rliger 2.0.1 RUN-VERIFIED on D27 (rna+atac_gas)
  online_iNMF: scmb_r       # [v] rliger 2.0.1 RUN-VERIFIED on D27 (rna+atac_gas)
  StabMap: scmb_r           # [v] bioconductor-stabmap

# Shared 'group' environments: each hosts several compatible methods.
# Generated by the env-groups workflow; see tools/gen_env_groups.py.
# Methods not listed in any group's members[] get their own env (singleton).
groups:
  scmb_torch:
    python_version: '3.9'
    conda_channels:
    - conda-forge
    - bioconda
    conda_packages:
    - r-base
    pip_packages:
    - numpy<2
    - torch>=2.2.2
    - scanpy
    - anndata
    - h5py
    - scipy
    - pandas
    - scikit-learn
    - umap-learn
    - leidenalg
    - python-igraph
    - louvain
    - networkx
    - matplotlib
    - seaborn
    - tqdm
    - numba
    - xgboost
    - munkres
    - easydl
    - scikit-misc
    - tables
    - rpy2
    - anndata2ri
    - scalex==1.0.4
    - scmomat
    - mira-multiome
    - uniport
    - scglue
    - sciPENN
    - gpsa
    - paste-bio
    - paste2==1.0.1
    - POT>=0.9.1
    - statsmodels
    - rich
    pip_git:
    - git+https://github.com/epurdom/cobolt.git#egg=cobolt
    - git+https://github.com/Teichlab/MultiMAP.git
    members:
    - SCALEX
    - Cobolt
    - scMDC
    - scMoMaT
    - uniPort
    - sciCAN
    - scJoint
    - MultiMAP
    - sciPENN
    - GPSA
    - PASTE
    - PASTE2
    excluded:
    - method: scMM
      reason: Depends on torchnet 0.0.4, whose malformed `torch (>=1.6<1.8)` metadata both trips pip>=24.1 (legacy version specifier) and hard-caps torch<1.8, which cascades pip back to an ancient pyro-ppl sdist (setup.py shells out to `git tag` and fails). scMM is the sole user of torchnet/pyro/torchvision among the group; its old-torch stack cannot coexist with the loose modern torch shared env. Keeps its own env (scmb_scmm).
    - method: moETM
      reason: Hard exact pins numpy==1.21.4 / scipy==1.7.1 / scanpy==1.9.1 / anndata==0.8.0 / torch==1.11.0 + scib==1.0.5 and GPU-only; these old exact pins (esp. scipy<1.8 for the removed scipy.sparse.csr.spmatrix import, torch 1.11) cannot coexist with the loose shared stack. Keeps its own env.
    - method: scMSI
      reason: Hard pin torch==1.13.1 plus anndata<0.10 (depends on the private anndata._core.sparse_dataset.SparseDataset removed in 0.10), forcing scanpy<1.10 / pandas<2; the exact-torch + capped-anndata stack would constrain/break the loose shared env. Keeps its own env.
    - method: SPIRAL
      reason: Heavy exact pins (torch==2.2.0, POT==0.8.0 with internal ot.gromov APIs, scanpy==1.9.8, anndata==0.10.5.post1, numpy==1.26.4, rpy2==3.5.15) plus extra R deps (r-mclust, r-vegan) and a hardcoded R binary path; the exact torch/POT/scanpy/anndata combo is mutually incompatible with the loose shared env. Keeps its own env.
    - method: iPOLNG
      reason: Exact pins numpy==1.21.0 / torch==1.11.0 (+cu113) / pyro-ppl==1.8.1 / statsmodels==0.12.2 / importlib_resources==5.8.0 and GPU-only (.type('torch.cuda.FloatTensor') hardcoded); the old exact torch/numpy/pyro combo conflicts with the shared loose stack. Keeps its own env.
    - method: UnitedNet
      reason: Requires Python 3.8 (cpython-37/38 .pyc artifacts, official spec py3.7 + torch==1.11.0); incompatible with the shared py3.9 target. Keeps its own py3.8 env.
    notes: 'Serves 17 of 23 torch-group candidates in one py3.9 env. Base shared stack = loose torch + scanpy + numpy<2 with additive per-method packages.


      PINS (and who forces them):

      - numpy<2: forced by nearly every member (np.mat/np.matrix/np.infty usage in SCALEX, Cobolt, scMM, scMDC, scMoMaT, SMILE, uniPort, GLUE, MultiMAP, sciCAN, scJoint, sciPENN, GPSA, PASTE, PASTE2). Kept as the env-wide floor.

      - scalex==1.0.4 + torch>=2.2.2: scalex 1.0.2 calls np.warnings (removed in numpy>=1.24), so it crashes on import under the numpy 1.26.4 floor; scalex 1.0.4 fixes that but requires torch>=2.2.2 and numpy>=1.26.4. numpy>=1.26.4 sits WITHIN the numpy<2 ceiling (pip picks 1.26.4), so there is no conflict. Both must be pinned explicitly: left unpinned, pip''s resolver drifts to scalex 1.0.2 + torch 1.13.1 (the np.warnings crash). torch>=2.2.2 resolves cleanly for all 17 members (verified: -> torch 2.8.0). This single scalex pin serves SCALEX (needs the classic `from scalex import SCALEX` API, present in 1.0.4).

      - paste2==1.0.1: pinned by PASTE2 for the PASTE2/projection submodule API.

      - POT>=0.9.1: PASTE2 requires POT>=0.9.1; PASTE''s requirements.txt pins POT==0.9.0 and GPSA leaves POT loose. POT==0.9.0 and POT>=0.9.1 directly conflict, so PASTE''s pin is RELAXED to >=0.9.1 (paste-bio uses the stable ot.backend.TorchBackend API and tolerates the 0.9.0->0.9.1 bump). Minor risk noted; if a PASTE run regresses, PASTE can fall back to its own env.


      torch pinned to >=2.2.2 (the floor scalex 1.0.4 requires; see above). Every EXCLUDED member was instead the source of a hard LOW torch pin (moETM/iPOLNG/UnitedNet torch==1.11.0, scMSI torch==1.13.1, SPIRAL torch==2.2.0, scMM torch<1.8 via torchnet) — none compatible with the >=2.2.2 floor, confirming their exclusion. All 17 included members accept modern torch, so pip resolves a single recent CUDA torch (verified -> 2.8.0).


      R BRIDGE for Portal: Portal imports rpy2 + anndata2ri at module load (portal/utils.py) and uses sc.pp.highly_variable_genes(flavor=''seurat_v3''), so conda r-base + pip rpy2/anndata2ri/scikit-misc are included (scikit-misc/skmisc also benefits GLUE, which uses the same seurat_v3 HVG flavor). bioconda channel added only to source r-base.


      pip_git kept as full URLs: Cobolt MUST come from epurdom/cobolt (the PyPI ''cobolt'' is an unrelated cobalt.tools wrapper needing py3.12); MultiMAP from Teichlab (not reliably on PyPI).


      Additive method-specific deps folded in: munkres (scMDC), easydl (sciCAN), xgboost (Cobolt), numba+tqdm (sciPENN), networkx+POT (GPSA/PASTE2), statsmodels (PASTE2), scmomat/mira-multiome/uniport/scglue/sciPENN/gpsa/paste-bio (the pip-installable method packages). leidenalg/igraph/louvain/umap-learn/seaborn/matplotlib pulled in for the scanpy clustering paths several members touch.


      CAVEATS unchanged by merging: many members are GPU-hardcoded (.cuda() in sciCAN, SMILE; cuda in scJoint default) and scJoint additionally loads an x86-64-only compiled util/libutility.so (won''t load on arm64 macOS) — these are runtime/platform constraints, not env-resolution conflicts, so they don''t affect inclusion. MIRA is env-OK but code-blocked (missing local logger.py); GLUE needs an external GTF file and an activated conda env at import time. Env name: scmb_torch. python 3.9 within multigrate''s 3.9-3.10 band and torch/numba wheel availability.'
