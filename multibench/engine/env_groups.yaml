    excluded:
    - method: Seurat_v3
      reason: Hard-pins r-base=4.2 + r-seurat=4.3 (v4-era anchor/CCA + v4 assay model via FindTransferAnchors/TransferData); incompatible with the shared Seurat>=5.0 / r-base>=4.2 env. Keeps its own per-method env.
    - method: Seurat_WNN
      reason: Caveat explicitly requires Seurat v4 (not v5) — WNN API (FindMultiModalNeighbors, weighted.nn neighbor slot) and the v4 assay model break under Seurat v5. Conflicts with the shared Seurat>=5.0 pin; keeps its own per-method env.
    notes: 'Pure-R shared env (no target Python env; the only Python is mofapy2 pulled in via pip for MOFA2''s reticulate bridge since run_mofa uses use_basilisk=FALSE). Built around Seurat v5 as the common base. PINS and who forces them: r-seurat>=5.0 forced by Seurat_v5 (bridge integration API); r-base>=4.2 forced by Seurat_v5 and online_iNMF; r-rliger>=2.0.1 is the tightest of the rliger requirements (UINMF needs >=2.0.1 for the modern 2.x API: createLiger/runUINMF/quantileNorm; online_iNMF needs >=2.0.0; iNMF unpinned) — all three satisfied by >=2.0.1. numpy<2 kept because MOFA2''s pip stack (mofapy2 2023-era) needs it. r-signac is shared by Seurat_v5; r-conos+r-pagoda2 by Conos; bioconductor-stabmap+SingleCellExperiment+scran by StabMap; bioconductor-mofa2+r-reticulate+r-reshape2 by MOFA2; bioconductor-rhdf5+hdf5array are common to every member for .h5 I/O. r-rcpp/r-rcppeigen/r-matrix/hdf5 from UINMF/online_iNMF native deps. r-seuratdisk/r-hdf5r/r-biocmanager/r-devtools are additive helper deps (left loose). All CRAN+Bioconductor packages here are co-installable in one conda solve; no genuine R package conflict among the 7 members beyond the Seurat-version split handled via exclusions. MOFA2 runtime requirement: reticulate must point at this env''s Python where mofapy2 is pip-installed (set RETICULATE_PYTHON or use the env python).'
  scmb_py37:
    python_version: '3.7'
    conda_channels:
    - conda-forge
    conda_packages:
    - python=3.7
    - pytorch=1.9.1
    - torchvision=0.10.1
    pip_packages:
    - numpy==1.19.5
    - scipy==1.7.1
    - pandas==1.3.4
    - h5py==3.1.0
    - scanpy==1.8.2
    - anndata>=0.7
    - scikit-learn==0.22.2
    - numba>=0.48
    - loompy
    - tqdm==4.62.3
    - matplotlib
    - hyperopt==0.1.2
    - xlrd==1.2.0
    - captum==0.4.1
    - pillow==8.4.0
    pip_git:
    - git+https://github.com/bm2-lab/scMVP.git
    members:
    - scMVP
    - Matilda
    excluded: []
    notes: 'No hard pin conflicts between scMVP and Matilda; both served by one py3.7 env. Pin reasons: python=3.7 (both; scMVP setup.py + Matilda official env). pytorch=1.9.1 / torchvision=0.10.1 forced by Matilda (scMVP leaves torch unpinned, so 1.9.1 satisfies both); installed via conda-forge CPU build, cudatoolkit dropped per Matilda caveat (run --device cpu / use_cuda=False). numpy==1.19.5 forced by Matilda and satisfies scMVP''s numpy<2 (required: main_scMVP.py uses np.mat, dataset.py uses np.bool, both removed in numpy 2.x). scipy==1.7.1, pandas==1.3.4, h5py==3.1.0, scanpy==1.8.2, tqdm==4.62.3, pillow==8.4.0 all forced by Matilda (scMVP unpinned on these, so no conflict). captum==0.4.1 forced by Matilda (additive; compatible with torch 1.9.1). scikit-learn==0.22.2 forced by scMVP (hard pin in its setup.py); Matilda does not constrain sklearn so the pin is safe. anndata>=0.7, numba>=0.48, loompy, matplotlib, hyperopt==0.1.2, xlrd==1.2.0 are scMVP-only additive deps. scMVP package itself is GitHub-only (bm2-lab/scMVP) — kept as pip_git; prefer `pip install -e` of the vendored local dir at scMultiBench_ref/tools_scripts/scMVP/scMVP/ as the primary install, git+URL is the fallback. Matilda is run as in-repo scripts (no pip/conda package) from scMultiBench_ref/tools_scripts/Matilda. No bioconda needed (no R/bioconductor deps).'
  scmb_tf:
    python_version: '3.8'
    conda_channels:
    - conda-forge
    conda_packages:
    - python=3.8
    pip_packages:
    - scbean
    - vipcca
    - tensorflow==2.8.0
    - keras==2.8.0
    - tensorflow-probability==0.16.0
    - astunparse
    - protobuf<3.20
    - numpy<2
    - scanpy
    - anndata
    - h5py
    - scipy
    - pandas
    - python-igraph
    - louvain
    pip_git: []
    members:
    - VIPCCA
    excluded:
    - method: Concerto
      reason: Hard-requires TensorFlow 2.4.1 with a rigid numpy==1.19.5 / scanpy==1.7.1 / pandas==1.1.5 / scipy==1.5.4 / h5py==2.10.0 stack that is incompatible with the shared TF 2.8.0 env (VIMCCA/VIPCCA); TF 2.4.1's numpy~=1.19.2 pin would break the others. Keeps its own per-method env.
    notes: 'VIMCCA and VIPCCA merge cleanly: both verified-working and both empirically need the same old-TF stack (tensorflow==2.8.0 + keras==2.8.0 + protobuf<3.20 + numpy<2), so those four pins are shared by both. tensorflow-probability==0.16.0 and astunparse are forced by VIMCCA only (scbean imports TFP and TF 2.8''s import path needs astunparse); they are additive and harmless for VIPCCA. protobuf<3.20 (both): avoids the ''Descriptors cannot be created directly'' error on TF 2.8. numpy<2 (both): VIPCCA''s data_loader uses np.mat (removed in numpy 2.x) and the old TF/scanpy stack requires it. keras==2.8.0 (both): standalone keras must match the TF 2.8 minor or imports break. Additive scientific deps (scanpy/anndata/h5py/scipy/pandas/python-igraph/louvain) left unpinned since neither member requires a specific version. Python pinned to 3.8 (group target); VIMCCA listed 3.9 but TF 2.8.0 ships cp38 wheels so 3.8 satisfies both. Apple Silicon caveat: tensorflow 2.8.0 x86 wheels may be unavailable on arm64 macOS; may need tensorflow-macos==2.8.0 + tensorflow-metal or an x86 conda/Rosetta env. Method dirs: VIMCCA at /Users/sdin3712/Documents/project_multibench/scMultiBench_ref/tools_scripts/VIMCCA/, VIPCCA at /Users/sdin3712/Documents/project_multibench/scMultiBench_ref/tools_scripts/VIPCCA/main_VIPCCA.py.'
