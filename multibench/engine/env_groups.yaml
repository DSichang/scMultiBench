    - bioconductor-delayedarray
    - bioconductor-scran
    - bioconductor-mofa2
    - bioconductor-rhdf5
    - bioconductor-hdf5array
    - r-reticulate
    - r-reshape2
    - r-dplyr
    - r-ggplot2
    - r-glue
    - r-cowplot
    - r-rcpp
    - r-rcppeigen
    - r-matrix
    - r-hdf5r
