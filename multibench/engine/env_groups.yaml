# method_env: method -> the conda env that runs it; each has a lockfile in
# env_locks/. An entry here takes precedence over `groups` membership below.
method_env:
  Seurat_v5: scmb_seurat5          # Seurat 5 + Signac bridge stack
  Seurat_v3: scmb_seurat4b         # Seurat 4.3.0.1 + SeuratObject 4.1.4 (5.x breaks RunCCA)
  Seurat_WNN: scmb_seurat5
  MIRA: scmb_mira
  Portal: scmb_torch_v2
  totalVI: scmb_scvi               # scvi-tools 1.3.3
  MultiVI: scmb_multivi            # scvi-tools 0.20.3 (the script uses the older API)
  scMSI: scmb_scmsi                # torch 1.9.1, pandas<2 (reasons in methods.yaml)
  scBridge: scmb_torch             # generic torch + scanpy stack, plus harmonypy 0.0.9
  Concerto: scmb_concerto          # uniout shim + openTSNE/faiss/sentencepiece (BERT stack)
  VIMCCA: scmb_vimcca              # scbean 0.5.6 + TensorFlow 2.4 + tensorflow-probability 0.12.2
  UnitedNet: unitednet
  SPIRAL: spiral_environment
  PASTE: paste_envi                # paste-bio + POT (TorchBackend) + torch
  PASTE2: paste_envi               # paste2==1.0.1 (PASTE2/projection)
  GPSA: scmb_gpsa2                 # numpy 1.26.4 + h5py 3.10 + scikit-learn 1.4.1 (a numpy 1.21.6 pin is unsatisfiable with them) + torch 2.2.2+cu118 (the 2.6 wheel rejects numpy<2 in from_numpy) + numba 0.59.1; gpytorch, linear_operator, jaxtyping, morphops and kneed are installed in the env because PYTHONNOUSERSITE=1 hides user-site copies
  MOFA2: MOFA2_env                 # R MOFA2; mofapy2 comes from the Python named by RETICULATE_PYTHON (methods.yaml)
  sciPENN: env_sciPENN             # torch 1.13.1+cu117, built for GPUs up to sm_86
  SMILE: env_sciPENN               # anndata 0.8.0 + scanpy 1.9.3 + numpy 1.21.6 handle both np.matrix coercion and bytes var_names
  Cobolt: scmb_cobolt3             # numpy 1.21.6 (np.quantile(np.matrix) needs numpy<1.22)
  Matilda: matilda                 # torch 2.1.2; matilda-sc is installed by env_locks/matilda.post.sh
  scMM: scmb_scmm2                 # old stack: torch 1.7.1 + torchnet 0.0.4
  scMDC: scmb_scmdc                # numpy<2 + torch + munkres
  sciCAN: scmb_scican              # torch + tensorflow + easydl
  Multigrate: scmb_multigrate2     # multigrate==0.0.2 with torchmetrics<0.11, anndata<0.9, scanpy<1.10
  scJoint: scmb_scjoint            # numpy<1.24 (the scripts use np.float)
  VIPCCA: scmb_vipcca27            # vipcca==0.2.7
  iPOLNG: scmb_ipolng2             # iPoLNG 0.0.2 + pyro 1.8.1 + torch 1.13.1+cu117 (runs on sm_89 GPUs; 1.11+cu102 does not) + numpy 1.23.5 + h5py 3.8.0 (h5py 3.14 with numpy 1.21 cannot read float64)
  scMVP: scmb_scmvp4               # python 3.7 + torch 1.9.1 + numpy 1.19.5 + scanpy 1.8.2
  UINMF: scmb_r                    # rliger 2.0.1, installed by env_locks/scmb_r.post.sh
  iNMF: scmb_r
  online_iNMF: scmb_r
  StabMap: scmb_r                  # bioconductor-stabmap

# groups: recipes for shared envs, each hosting several compatible methods. A
# method in neither method_env nor any members[] gets its own scmb_<method> env.
groups:
  scmb_torch:
    python_version: '3.9'
    conda_channels:
    - conda-forge
    - bioconda
    conda_packages:
    - r-base
    pip_packages:
    - numpy<2
    - torch>=2.2.2
    - scanpy
    - anndata
    - h5py
    - scipy
    - pandas
    - scikit-learn
    - umap-learn
    - leidenalg
    - python-igraph
    - louvain
    - networkx
    - matplotlib
    - seaborn
    - tqdm
    - numba
    - xgboost
    - munkres
    - easydl
    - scikit-misc
    - tables
    - rpy2
    - anndata2ri
    - scalex==1.0.4
    - scmomat
    - mira-multiome
    - uniport
    - scglue
    - sciPENN
    - gpsa
    - paste-bio
    - paste2==1.0.1
    - POT>=0.9.1
    - statsmodels
    - rich
    pip_git:
    - git+https://github.com/epurdom/cobolt.git#egg=cobolt
    - git+https://github.com/Teichlab/MultiMAP.git
    members:
    - SCALEX
    - scMDC
    - scMoMaT
    - uniPort
    - sciCAN
    - scJoint
    - MultiMAP
    - sciPENN
    - PASTE
    - PASTE2
    excluded:
    - method: scMM
      reason: Depends on torchnet 0.0.4, whose malformed `torch (>=1.6<1.8)` metadata both trips pip>=24.1 (legacy version specifier) and hard-caps torch<1.8, which cascades pip back to an ancient pyro-ppl sdist (setup.py shells out to `git tag` and fails). scMM is the sole user of torchnet/pyro/torchvision among the group; its old-torch stack cannot coexist with the loose modern torch shared env. Keeps its own env (scmb_scmm2).
    - method: moETM
      reason: Hard exact pins numpy==1.21.4 / scipy==1.7.1 / scanpy==1.9.1 / anndata==0.8.0 / torch==1.11.0 + scib==1.0.5 and GPU-only; these old exact pins (esp. scipy<1.8 for the removed scipy.sparse.csr.spmatrix import, torch 1.11) cannot coexist with the loose shared stack. Keeps its own env.
    - method: scMSI
      reason: Hard pin torch==1.13.1 plus anndata<0.10 (depends on the private anndata._core.sparse_dataset.SparseDataset removed in 0.10), forcing scanpy<1.10 / pandas<2; the exact-torch + capped-anndata stack would constrain/break the loose shared env. Keeps its own env.
    - method: SPIRAL
      reason: Heavy exact pins (torch==2.2.0, POT==0.8.0 with internal ot.gromov APIs, scanpy==1.9.8, anndata==0.10.5.post1, numpy==1.26.4, rpy2==3.5.15) plus extra R deps (r-mclust, r-vegan) and a hardcoded R binary path; the exact torch/POT/scanpy/anndata combo is mutually incompatible with the loose shared env. Keeps its own env.
    - method: iPOLNG
      reason: Exact pins numpy==1.21.0 / torch==1.11.0 (+cu113) / pyro-ppl==1.8.1 / statsmodels==0.12.2 / importlib_resources==5.8.0 and GPU-only (.type('torch.cuda.FloatTensor') hardcoded); the old exact torch/numpy/pyro combo conflicts with the shared loose stack. Keeps its own env.
    - method: UnitedNet
      reason: Requires Python 3.8 (cpython-37/38 .pyc artifacts, official spec py3.7 + torch==1.11.0); incompatible with the shared py3.9 target. Keeps its own py3.8 env.
    notes: |-
      One py3.9 env: loose torch + scanpy + numpy<2, plus each method's own packages.

      Pins:
      - numpy<2: nearly every method here uses np.mat / np.matrix / np.infty.
      - scalex==1.0.4 + torch>=2.2.2: scalex 1.0.2 calls np.warnings (removed in numpy 1.24) and fails
        at import; 1.0.4 fixes that but requires torch>=2.2.2 and numpy>=1.26.4, which lies inside the
        numpy<2 ceiling. Both are pinned because pip otherwise resolves scalex 1.0.2 + torch 1.13.1.
      - paste2==1.0.1: PASTE2 uses the PASTE2/projection submodule API.
      - POT>=0.9.1: required by PASTE2. PASTE's requirements.txt pins POT==0.9.0; that pin is relaxed
        here, since paste-bio only uses the stable ot.backend.TorchBackend API.

      Every excluded method hard-pins an older torch (moETM / iPOLNG / UnitedNet 1.11.0, scMSI 1.13.1,
      SPIRAL 2.2.0, scMM <1.8 through torchnet), below the 2.2.2 floor.

      R bridge: Portal imports rpy2 + anndata2ri at module load (portal/utils.py) and uses
      sc.pp.highly_variable_genes(flavor='seurat_v3'), hence conda r-base + pip rpy2 / anndata2ri /
      scikit-misc (GLUE uses the same HVG flavour). bioconda is listed only to supply r-base.

      pip_git: Cobolt must come from epurdom/cobolt (the PyPI 'cobolt' is an unrelated package that
      needs py3.12); MultiMAP from Teichlab (not reliably on PyPI).

      Method-specific packages: munkres (scMDC), easydl (sciCAN), xgboost (Cobolt), numba + tqdm
      (sciPENN), networkx + POT (GPSA, PASTE2), statsmodels (PASTE2), and the pip-installable method
      packages (scmomat, mira-multiome, uniport, scglue, sciPENN, gpsa, paste-bio). leidenalg, igraph,
      louvain, umap-learn, seaborn and matplotlib serve the scanpy clustering paths.

      Run-time constraints that do not affect the env: sciCAN and SMILE call .cuda() unconditionally;
      scJoint loads an x86-64-only util/libutility.so (no arm64 macOS); MIRA lacks its local logger.py;
      GLUE needs an external GTF file and an activated conda env at import time.
  scmb_r:
    python_version: ''
    conda_channels:
    - conda-forge
    - bioconda
    conda_packages:
    - r-base>=4.2
    - r-seurat>=5.0
    - r-signac
    - r-rliger>=2.0.1
    - r-conos
    - r-pagoda2
    - bioconductor-stabmap
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - bioconductor-delayedarray
    - bioconductor-scran
    - bioconductor-mofa2
    - bioconductor-rhdf5
    - bioconductor-hdf5array
    - r-reticulate
    - r-reshape2
    - r-dplyr
    - r-ggplot2
    - r-glue
    - r-cowplot
    - r-rcpp
    - r-rcppeigen
    - r-matrix
    - r-hdf5r
    - r-seuratdisk
    - r-biocmanager
    - r-devtools
    - hdf5
    pip_packages:
    - mofapy2
    - numpy<2
    - scipy
    - pandas
    - h5py
    - scikit-learn
    pip_git: []
    members:
    - Seurat_v5
    - StabMap
    - UINMF
    - iNMF
    - online_iNMF
    - Conos
    - MOFA2
    excluded:
    - method: Seurat_v3
      reason: Hard-pins r-base=4.2 + r-seurat=4.3 (v4-era anchor/CCA + v4 assay model via FindTransferAnchors/TransferData); incompatible with the shared Seurat>=5.0 / r-base>=4.2 env. Keeps its own per-method env.
    - method: Seurat_WNN
      reason: Caveat explicitly requires Seurat v4 (not v5) — WNN API (FindMultiModalNeighbors, weighted.nn neighbor slot) and the v4 assay model break under Seurat v5. Conflicts with the shared Seurat>=5.0 pin; keeps its own per-method env.
    notes: |-
      R env built around Seurat v5; the only Python is mofapy2, which MOFA2 reaches through
      reticulate because run_mofa uses use_basilisk=FALSE (point RETICULATE_PYTHON at this env's
      Python).

      Pins: r-seurat>=5.0 (Seurat_v5 bridge integration API); r-base>=4.2 (Seurat_v5, online_iNMF);
      r-rliger>=2.0.1 (UINMF needs the 2.x API: createLiger / runUINMF / quantileNorm; online_iNMF
      needs >=2.0.0; iNMF is unpinned); numpy<2 (mofapy2).

      Packages by method: r-signac (Seurat_v5); r-conos + r-pagoda2 (Conos); bioconductor-stabmap,
      SingleCellExperiment, scran (StabMap); bioconductor-mofa2, r-reticulate, r-reshape2 (MOFA2);
      r-rcpp, r-rcppeigen, r-matrix, hdf5 (UINMF / online_iNMF native code); bioconductor-rhdf5 +
      hdf5array for .h5 I/O in every method. r-seuratdisk, r-hdf5r, r-biocmanager and r-devtools are
      unpinned helpers. The only conflict among the members is the Seurat version, handled by the
      exclusions.
  scmb_py37:
    python_version: '3.7'
    conda_channels:
    - conda-forge
    conda_packages:
    - python=3.7
    - pytorch=1.9.1
    - torchvision=0.10.1
    pip_packages:
    - numpy==1.19.5
    - scipy==1.7.1
    - pandas==1.3.4
    - h5py==3.1.0
    - scanpy==1.8.2
    - anndata>=0.7
    - scikit-learn==0.22.2
    - numba>=0.48
    - loompy
    - tqdm==4.62.3
    - matplotlib
    - hyperopt==0.1.2
    - xlrd==1.2.0
    - captum==0.4.1
    - pillow==8.4.0
    pip_git:
    - git+https://github.com/bm2-lab/scMVP.git
    members:
    - scMVP
    - Matilda
    excluded: []
    notes: |-
      One py3.7 env for scMVP and the Matilda scripts; their pins do not conflict.

      Forced by Matilda: pytorch=1.9.1 / torchvision=0.10.1 (CPU build, so run with --device cpu;
      scMVP leaves torch unpinned), numpy==1.19.5, scipy==1.7.1, pandas==1.3.4, h5py==3.1.0,
      scanpy==1.8.2, tqdm==4.62.3, pillow==8.4.0, captum==0.4.1. numpy 1.19.5 also meets scMVP's
      need for numpy<2 (main_scMVP.py uses np.mat, dataset.py np.bool).
      Forced by scMVP: scikit-learn==0.22.2 (hard pin in its setup.py); anndata>=0.7, numba>=0.48,
      loompy, matplotlib, hyperopt==0.1.2 and xlrd==1.2.0 are scMVP-only.

      The scMVP package is GitHub-only (bm2-lab/scMVP), hence pip_git; `pip install -e` of
      tools_scripts/scMVP/scMVP/ in the scMultiBench checkout is the alternative.
  scmb_tf:
    python_version: '3.8'
    conda_channels:
    - conda-forge
    conda_packages:
    - python=3.8
    pip_packages:
    - scbean
    - vipcca
    - tensorflow==2.8.0
    - keras==2.8.0
    - tensorflow-probability==0.16.0
    - astunparse
    - protobuf<3.20
    - numpy<2
    - scanpy
    - anndata
    - h5py
    - scipy
    - pandas
    - python-igraph
    - louvain
    pip_git: []
    members:
    - VIPCCA
    excluded:
    - method: Concerto
      reason: Hard-requires TensorFlow 2.4.1 with a rigid numpy==1.19.5 / scanpy==1.7.1 / pandas==1.1.5 / scipy==1.5.4 / h5py==2.10.0 stack that is incompatible with the shared TF 2.8.0 env (VIMCCA/VIPCCA); TF 2.4.1's numpy~=1.19.2 pin would break the others. Keeps its own per-method env.
    notes: |-
      TensorFlow 2.8 stack for VIPCCA and VIMCCA (scbean).

      Shared pins: tensorflow==2.8.0; keras==2.8.0 (standalone keras must match the TF minor);
      protobuf<3.20 (avoids 'Descriptors cannot be created directly' on TF 2.8); numpy<2 (VIPCCA's
      data_loader uses np.mat). tensorflow-probability==0.16.0 and astunparse are needed by VIMCCA
      only (scbean imports TFP; TF 2.8's import path needs astunparse). Python 3.8: TF 2.8.0 ships
      cp38 wheels.

      arm64 macOS: tensorflow 2.8.0 wheels may be unavailable; tensorflow-macos==2.8.0
      (+ tensorflow-metal) or an x86 (Rosetta) env may be needed.
  glue:
    python_version: '3.8'
    conda_channels:
    - conda-forge
    - bioconda
    pip_packages:
    - scglue==0.3.2
    - scanpy
    - anndata
    - networkx
    members:
    - GLUE
    notes: 'scglue==0.3.2 plus a gencode GTF (gencode.v43.*.annotation.gtf.gz) in the run working directory.'
  env_moETM:
    python_version: '3.9'
    conda_channels:
    - conda-forge
    pip_packages:
    - torch
    - scanpy
    - anndata
    - h5py
    members:
    - moETM
    notes: 'torch + scanpy stack for moETM.'
