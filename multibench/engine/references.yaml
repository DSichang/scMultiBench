# Provenance per method: where the upstream code lives, the version the benchmark
# ran, a one-line third-person summary, and the paper to cite.
#
#   repo_url / version  - from scMultiBench's README "Integration Tools" list
#   summary             - <= 200 chars, third person (method_info()['notes'])
#   reference           - {doi, title, authors, journal, year}; every DOI here
#                         was resolved against the Crossref registry
#                         (api.crossref.org/works/<doi>) and the returned title
#                         checked against the method. NEVER add a DOI from memory.
#   _benchmark          - the benchmark's own citation (scMultiBench CITATION.cff)
#
# A method without `reference:` has no DOI we could verify yet (see
# tests/test_references.py::UNREFERENCED for the list) - add it with its
# Crossref check, do not guess.

_benchmark:
  doi: 10.1038/s41592-025-02856-3
  title: Multitask benchmarking of single-cell multimodal omics integration methods
  authors: Liu C, Ding S, Kim HJ, Long S, Xiao D, Ghazanfar S, Yang P
