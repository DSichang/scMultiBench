# Observed method runtimes: reference data, not a prediction.
#
# Measured on one shared machine (2x RTX 4090, 64 cores, often under load) on the
# datasets listed; runtime varies with hardware, cell count and load. Every value
# is rounded up, so a listed time is never shorter than the run took. Use it to
# size run_all(timeout=...), with headroom.
#
# tier:   fast < 5 min | medium 5-30 min | slow 30 min-2 h | very_slow > 2 h
# source: manual (hand-kept row) | summary_csv (run_sec in
#         notebooks/results/summary_D*.csv) | recorded (wall time of a recorded
#         end-to-end run). The longest time per (method, dataset) is kept.
# cells is null where no run recorded the count; D46's count is the sum of the
# rna1-3.h5 barcodes of the fetched dataset (8404 + 8845 + 4167).
# tests/test_runtime_table.py pins these invariants.
