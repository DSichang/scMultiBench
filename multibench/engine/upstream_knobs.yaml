online_iNMF:
  fixed_in_script: []
  upstream_knobs:
  - default: '1'
    effect: inner HALS block coordinate descent iterations per minibatch
    name: HALSiter
  - default: 2L
    effect: number of parallel tasks used by the solver
    name: nCores
  - default: '0.1'
    effect: variance threshold deciding how many shared variable genes enter the factorization
      (this script raises it to 0.2)
    name: 'selectGenes thresh (1.x name: var.thresh)'
  - default: '50'
    effect: number of quantiles used when stretching each dataset's factor loadings onto the
      reference
    name: quantileNorm quantiles
  upstream_url: https://welch-lab.github.io/liger/reference/runOnlineINMF.html
scMSI:
  fixed_in_script:
  - name: target_sum (normalize_total)
    source: tools_scripts/scMSI/main_scMSI.py:66
    value: 1e4
  - name: latent_distribution
    source: tools_scripts/scMSI/main_scMSI.py:73
    value: '"normal"'
  - name: batch_size (inference)
    source: tools_scripts/scMSI/main_scMSI.py:79
    value: '128'
  upstream_knobs:
  - default: '"nb"'
    effect: count distribution for the RNA decoder, negative binomial vs zero-inflated NB
    name: gene_likelihood
  - default: '"nbm"'
    effect: 'count distribution for the ADT decoder: NB-mixture (background/foreground), plain
      NB, or Poisson'
    name: protein_likelihood
  - default: '"gene"'
    effect: whether the NB dispersion is shared per gene or varies per batch/label/cell
    name: gene_dispersion
  - default: '0.9'
    effect: fraction of cells used for training; the remaining cells (10% at the default)
      are held out for validation
    name: train_size
  - default: 1e-6
    effect: L2 penalty on the network weights during optimization
    name: weight_decay
  upstream_url: https://github.com/ChengmingZhang-CAS/scMSI-master
scMVP:
  fixed_in_script:
  - name: torch_num_threads
    source: tools_scripts/scMVP/main_scMVP.py:19
    value: '40'
  - name: normalize_total target_sum (RNA)
    source: tools_scripts/scMVP/main_scMVP.py:42
    value: 1e4
  - name: atac_threshold (LoadData peak filter)
    source: tools_scripts/scMVP/main_scMVP.py:104
    value: '0.001'
  - name: cell_threshold (LoadData cell filter)
    source: tools_scripts/scMVP/main_scMVP.py:105
    value: '1'
  - name: use_cuda
    source: tools_scripts/scMVP/main_scMVP.py:110
    value: 'True'
  - name: n_alfa (attention/loss weight)
    source: tools_scripts/scMVP/main_scMVP.py:112
    value: '1.0'
  - name: train_size
    source: tools_scripts/scMVP/main_scMVP.py:119
    value: '0.9'
  - name: frequency (metric-monitoring interval, epochs)
    source: tools_scripts/scMVP/main_scMVP.py:121
    value: '5'
  upstream_knobs:
  - default: '128'
    effect: width of each encoder/decoder hidden layer
    name: n_hidden
  - default: '1'
    effect: depth of the encoder/decoder networks
    name: n_layers
  - default: '0.1'
    effect: dropout applied in the encoder/decoder
    name: dropout_rate
  - default: '"zinb"'
    effect: likelihood for the RNA channel, zero-inflated vs plain negative binomial
    name: reconstruction_loss
  - default: '20'
    effect: number of training epochs
    name: n_epochs (Trainer.train)
  - default: '200'
    effect: epochs over which the KL term is annealed to full weight
    name: n_epochs_kl_warmup (MultiTrainer)
  upstream_url: https://raw.githubusercontent.com/bm2-lab/scMVP/master/scMVP/models/multi_vae_attention.py
scMoMaT:
  fixed_in_script:
  - name: interval (print/checkpoint interval)
    source: tools_scripts/scMoMaT/main_scMoMaT.py:82
    value: '1000'
  - name: r (neighborhood radius for post-graph)
    source: tools_scripts/scMoMaT/main_scMoMaT.py:96
    value: None
  - name: njobs (parallel jobs for calc_post_graph)
    source: tools_scripts/scMoMaT/main_scMoMaT.py:97
    value: '8'
  - name: UMAP n_components / min_dist / random_state
    source: tools_scripts/scMoMaT/main_scMoMaT.py:98
    value: n_components=2, min_dist=0.20, random_state=0
  upstream_knobs:
  - default: no default — required positional argument; README recommends 30~50
    effect: neighborhood size of the post-processed kNN graph that is the method's output
    name: n_neighbors (calc_post_graph)
  - default: None
    effect: radius parameter (0-1) bounding neighborhood size as an alternative to a fixed
      k
    name: r (calc_post_graph)
  upstream_url: https://github.com/PeterZZQ/scMoMaT/blob/main/scmomat/model.py
sciCAN:
  fixed_in_script:
  - name: normalize_total.target_sum (RNA)
    source: tools_scripts/sciCAN/main_sciCAN.py:34
    value: 1e4
  - name: normalize_total.target_sum (ATAC gene-activity)
    source: tools_scripts/sciCAN/main_sciCAN.py:34
    value: 1e4
  upstream_knobs:
  - default: None
    effect: lets the caller pass a pre-built (or pretrained) scCluster network instead of
      the one constructed internally
    name: encoder
  - default: '10'
    effect: number of soft cluster/prototype heads in the encoder's softmax cluster-assignment
      branch (Cycle_train_wolabel builds it with clf_out=25 when encoder is None)
    name: clf_out (via a caller-supplied scCluster)
  upstream_url: https://raw.githubusercontent.com/rpmccordlab/sciCAN/main/sciCAN/training.py
totalVI:
  fixed_in_script:
  - name: protein_expression_obsm_key (setup_anndata)
    source: tools_scripts/totalVI/main_totalVI.py:86
    value: '"protein_expression"'
  - name: batch_key (setup_anndata) — batch is synthesized as one batch per input file
    source: tools_scripts/totalVI/main_totalVI.py:88
    value: '"batch"'
  upstream_knobs:
  - default: '''protein'''
    effect: whether protein dispersion is shared globally or estimated per batch/label
    name: protein_dispersion
  upstream_url: https://raw.githubusercontent.com/scverse/scvi-tools/main/src/scvi/model/_totalvi.py
