    source: tools_scripts/Concerto/main_Concerto.py:34
    value: batch_size=64, epoch_pretrain=3, lr=1e-4, drop_rate=0.1
  notes: 'The command line takes only --path1, --path2 and --save_path. main_Concerto.py redefines
    concerto_train_multimodal (lines 27-131), shadowing the library function, so embedding_dims=128,
    head_1/2/3=128, shuffle_size=10000, temperature=0.1 and total_update_steps=300*epoch_pretrain
