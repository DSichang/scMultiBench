[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibench-sc"
version = "0.3.0"
description = "Clean Python API wrapping the scMultiBench benchmark: run methods, evaluate, and plot."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24", "matplotlib>=3.7", "h5py>=3.8", "anndata>=0.9", "pyyaml>=6.0", "scanpy>=1.9", "scib>=1.1"]

[project.urls]
Homepage = "https://dsichang.github.io/scMultiBench/"
Repository = "https://github.com/DSichang/scMultiBench"
Upstream = "https://github.com/PYangLab/scMultiBench"
Paper = "https://doi.org/10.1038/s41592-025-02856-3"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
eval = []  # kept for compatibility: evaluation now ships with the core install
loom = ["loompy>=3.0"]

[project.scripts]
multibench = "multibench.cli:main"

[tool.setuptools]
packages = ["multibench", "multibench.data", "multibench.eval", "multibench.plot", "multibench.engine"]

[tool.setuptools.package-data]
multibench = ["engine/methods.yaml", "engine/env_specs.yaml", "engine/env_groups.yaml", "engine/params.yaml", "engine/upstream_knobs.yaml", "engine/runtimes.yaml", "engine/env_locks/*.yml", "engine/env_locks/*.sh", "engine/drivers/*", "engine/drivers/spiral_support/*", "engine/drivers/spiral_support/spiral/*", "engine/packed_urls.json", "engine/references.yaml", "files/*", "result/rerun/*.csv", "result/scib_metric/*/*/*/*.csv", "result/scib_metric/*/*/*/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
