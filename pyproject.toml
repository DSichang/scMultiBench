[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multibench-sc"
dynamic = ["version"]
description = "Runs and scores the single-cell multimodal integration methods of the scMultiBench benchmark from Python."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24", "matplotlib>=3.7", "h5py>=3.8", "anndata>=0.9", "pyyaml>=6.0", "scanpy>=1.9", "scib>=1.1", "umap-learn!=0.6.0", "pynndescent<0.7; python_version < '3.12'"]

[project.urls]
Homepage = "https://dsichang.github.io/scMultiBench/"
Repository = "https://github.com/DSichang/scMultiBench"
Upstream = "https://github.com/PYangLab/scMultiBench"
Paper = "https://doi.org/10.1038/s41592-025-02856-3"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["multibench*"]
namespaces = false

[tool.setuptools.dynamic]
# one source: the string in multibench/__init__.py (read statically, no import)
version = {attr = "multibench.__version__"}

[tool.setuptools.package-data]
multibench = ["engine/methods.yaml", "engine/env_groups.yaml", "engine/params.yaml", "engine/upstream_knobs.yaml", "engine/runtimes.yaml", "engine/env_locks/*.yml", "engine/env_locks/*.sh", "engine/drivers/*", "engine/helpers/*/*", "engine/scripts_archive.json", "engine/packed_urls.json", "engine/packed_sizes.json", "engine/packed_layers.json", "engine/packed_windows.json", "engine/packed_macos.json", "engine/references.yaml", "files/*", "result/rerun/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
