[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibench"
version = "0.1.0"
description = "Clean Python API wrapping the scMultiBench benchmark: run methods, evaluate, and plot."
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "h5py>=3.8", "anndata>=0.9", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
eval = ["scib>=1.1"]

[project.scripts]
multibench = "multibench.cli:main"

[tool.setuptools]
packages = ["multibench", "multibench.data", "multibench.eval", "multibench.plot", "multibench.run"]

[tool.setuptools.package-data]
multibench = ["run/methods.yaml", "run/env_specs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
