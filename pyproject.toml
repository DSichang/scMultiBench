[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibench-sc"
version = "0.2.0"
description = "Clean Python API wrapping the scMultiBench benchmark: run methods, evaluate, and plot."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24", "matplotlib>=3.7", "h5py>=3.8", "anndata>=0.9", "pyyaml>=6.0", "scanpy>=1.9", "scib>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
eval = []  # kept for compatibility: evaluation now ships with the core install
loom = ["loompy>=3.0"]

[project.scripts]
multibench = "multibench.cli:main"

[tool.setuptools]
packages = ["multibench", "multibench.data", "multibench.eval", "multibench.plot", "multibench.engine"]

[tool.setuptools.package-data]
multibench = ["engine/methods.yaml", "engine/env_specs.yaml", "engine/env_groups.yaml", "engine/params.yaml", "engine/runtimes.yaml", "engine/env_locks/*.yml", "engine/env_locks/*.sh", "engine/drivers/*", "engine/packed_urls.json", "files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
