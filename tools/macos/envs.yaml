# The method environments built for macOS on Apple silicon, and the methods each archive serves.
# tools/macos/build.py builds an env from the package's Linux lock (multibench/engine/env_locks/<env>.yml)
# and the hand files in tools/macos/envs/<env>/; tests/test_macos_build_tool.py checks this list against
# the package. Left out of an env here because a dependency has no Apple silicon build: Conos (scmb_r:
# r-conos, r-pagoda2). Not built for macOS at all: the envs of methods that need an NVIDIA GPU, of the
# methods on Python 3.7, on torch 1.7/1.9 or TensorFlow 2.4/2.8, and MOFA2 (no osx-arm64 build).
matilda: [Matilda]
scmb_r: [StabMap, UINMF, iNMF, online_iNMF]
scmb_seurat5: [Seurat_v5, Seurat_WNN]
scmb_seurat4b: [Seurat_v3]
scmb_scjoint: [scJoint]
scmb_cobolt3: [Cobolt]
scmb_multigrate2: [Multigrate]
scmb_multivi: [MultiVI]
scmb_scvi: [totalVI]
scmb_mira: [MIRA]
glue: [GLUE]
scmb_torch: [SCALEX, scMDC, scMoMaT, uniPort, MultiMAP]
scmb_torch_v2: [Portal]
